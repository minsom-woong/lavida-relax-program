    '</div></div>';
  return h+'</div>';
}
function rpNum(v,label,tone){
  return '<div class="num '+tone+'"><div class="bar"></div><div class="in"><div><span class="v">'+v+'</span></div><div class="l">'+label+'</div></div></div>';
}

/* ===================== 서버 동기화 (인터넷 주소로 열었을 때만) =====================
   화면 코드는 그대로 두고, 저장(save)·되돌리기·자료 창고만 서버로 갈아끼운다.
   · 불러오기: 로그인하면 서버 표를 전부 받아 S를 다시 만든다
   · 저장: 바뀐 줄만 골라 서버에 보낸다 (메모는 한 건씩 → 동시에 써도 안 겹침)
   · 받기: 다른 기기에서 바뀐 줄이 실시간으로 들어오면 화면을 다시 그린다
   · 되돌리기: 내가 바꾼 줄만 되돌린다 (그사이 남이 바꾼 줄은 건드리지 않음) */
const SY_TABLES=["staff","members","attendance","notes","contacts","regs","trials","settings"];
const SY_PUSH_ORDER=["staff","members","attendance","notes","contacts","regs","trials","settings"];
const SY_SETTINGS=["limitRelax","limitRebuild","goneDays","lostDays","workDays","lastImport","lesRules","lesPrice","lesDays","lesPriceHist","payCfg"];   /* 급여 칸(사람마다 다른 숫자)은 settings가 아니라 pay 표 */
const syIsD=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||""))?String(v):null;
const syTs=v=>{ if(!v)return null; const d=new Date(v); return isNaN(d)?null:d.toISOString(); };
/* 키 순서와 상관없이 같은 내용이면 같은 글자가 나오게 (서버 jsonb는 키 순서를 바꾼다) */
function syCanon(v){
  if(v===undefined)return "null";
  if(v===null||typeof v!=="object")return JSON.stringify(v);
  if(Array.isArray(v))return "["+v.map(syCanon).join(",")+"]";
  return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+syCanon(v[k])).join(",")+"}";
}
const syClone=o=>o==null?o:JSON.parse(JSON.stringify(o));

/* ── 표마다: 열쇠·서버 줄로 바꾸기·서버 줄 다듬기 ── */
const SYC={
  staff:{key:r=>r.id, cols:["id","name","sort","extra"],
    rows(){ return (S.staff||[]).map((s,i)=>{ const {id,name,...rest}=s; return {id,name:name||"",sort:i,extra:rest}; }); }},
  members:{key:r=>r.id, cols:["id","name","phone","birth","addr","birth_hand","addr_hand","staff_id","trashed","trash_at","trash_by","excel_memo","passes","doc_order","extra"],
    rows(){ const st=new Set((S.staff||[]).map(s=>s.id).concat(Object.keys(SYNC.RC.staff||{})));
      return (S.members||[]).map(m=>{
        const {id,name,phone,birth,addr,birthHand,addrHand,staffId,trashed,trashAt,trashBy,memo,passes,docOrder,att,notes,acts,...rest}=m;
        if(staffId&&!st.has(staffId))rest._staffId=staffId;
        return {id,name:name||"",phone:phone||null,birth:birth||null,addr:addr||null,birth_hand:!!birthHand,addr_hand:!!addrHand,
          staff_id:(staffId&&st.has(staffId))?staffId:null,trashed:!!trashed,trash_at:trashAt==null?null:String(trashAt),trash_by:trashBy==null?null:String(trashBy),
          excel_memo:memo==null?null:String(memo),passes:passes||[],doc_order:docOrder||[],extra:rest}; }); }},
  attendance:{key:r=>r.member_id+"|"+r.day+"|"+r.time+"|"+r.teacher, cols:["member_id","day","time","end_time","teacher"],
    rows(){ const out=[]; (S.members||[]).forEach(m=>{ const seen={}; (m.att||[]).forEach(a=>{ const day=syIsD(a.date); if(!day)return;
      const r={member_id:m.id,day,time:a.time||"",end_time:a.end||"",teacher:a.teacher||""}, k=SYC.attendance.key(r);
      if(seen[k])return; seen[k]=1; out.push(r); }); }); return out; }},
  notes:{key:r=>r.id, cols:["id","member_id","day","kind","body","by_name","created_at"],
    rows(){ const out=[]; (S.members||[]).forEach(m=>{ const ns=m.notes||[]; ns.forEach((n,i)=>{
      if(!n.id)n.id=(crypto.randomUUID?crypto.randomUUID():uid("n"));
      if(!n.at)n.at=new Date(Date.now()-i).toISOString();
      const day=syIsD(n.d)||TODAY();
      out.push({id:n.id,member_id:m.id,day,kind:n.kind||"",body:String(n.t||""),by_name:n.by||null,created_at:syTs(n.at)}); }); }); return out; }},
  contacts:{key:r=>r.member_id+"|"+r.kind, cols:["member_id","kind","day","rem","by_name"],
    rows(){ const out=[]; (S.members||[]).forEach(m=>{ const a=m.acts||{}; Object.keys(a).forEach(k=>{ const x=a[k]||{}; const day=syIsD(x.d); if(!day)return;
      out.push({member_id:m.id,kind:k,day,rem:(x.rem==null||isNaN(+x.rem))?null:Math.round(+x.rem),by_name:x.by||null}); }); }); return out; }},
  regs:{key:r=>r.id, cols:["id","member_id","name","day","ym","kind","plan","amount","staff_id","by_name","extra"],
    rows(){ const ms=new Set((S.members||[]).map(m=>m.id)), st=new Set(Object.keys(SYNC.RC.staff||{}).concat((S.staff||[]).map(s=>s.id)));
      return (S.regs||[]).map(r=>{ const {id,...rest}=r;
        return {id,member_id:ms.has(r.memberId)?r.memberId:null,name:r.name||null,day:syIsD(r.date),ym:r.ym||null,kind:r.kind||null,plan:r.plan||null,
          amount:Math.round(+r.amount)||0,staff_id:st.has(r.staffId)?r.staffId:null,by_name:r.by||null,extra:rest}; }); }},
  trials:{key:r=>r.id, cols:["id","name","phone","day","staff_id","member_id","data","sign"],
    rows(){ const ms=new Set((S.members||[]).map(m=>m.id)), st=new Set(Object.keys(SYNC.RC.staff||{}).concat((S.staff||[]).map(s=>s.id)));
      return (S.trials||[]).map(t=>{ const {id,sign,...rest}=t;
        return {id,name:t.name||null,phone:t.phone||null,day:syIsD(t.date),staff_id:st.has(t.staffId)?t.staffId:null,member_id:ms.has(t.memberId)?t.memberId:null,
          data:rest,sign:sign||null}; }); }},
  settings:{key:r=>r.key, cols:["key","value"],
    rows(){ const out=SY_SETTINGS.filter(k=>S[k]!==undefined&&S[k]!==null).map(k=>({key:k,value:S[k]}));
      Object.keys(S.lessons||{}).forEach(ym=>{ if(S.lessons[ym])out.push({key:"les:"+ym,value:S.lessons[ym]}); });   /* 수업 집계 — 달마다 한 줄 */
      return out; }}
};
/* 서버에서 온 줄을 비교용 모양으로 다듬기 */
function syNorm(t,r){
  const o={}; SYC[t].cols.forEach(c=>{ let v=r[c]; if(v===undefined)v=null;
    if(c==="created_at")v=syTs(v);
    if(c==="day"&&v)v=String(v).slice(0,10);
    o[c]=v; });
  return o;
}

/* ── 지금 화면 상태(S) → 서버와 다른 줄 찾기 ── */
function syFlush(){
  if(!SYNC.on||!SYNC.loaded)return 0;
  trMergeRC();     /* 체험: 다른 기기에서 온 그림·글을 먼저 합친 뒤 보낸다 */
  let n=0;
  /* 비교 기준은 '내 화면을 마지막으로 만든 상태(BASE)'다. 서버 최신(RC)과 비교하면
     다른 기기에서 막 들어온 줄을 내가 지운 것으로 착각한다 */
  SY_TABLES.forEach(t=>{
    if(t==="staff"&&!SYNC.admin)return;           /* 강사 목록은 관리자만 바꾼다 */
    const base=(SYNC.BASE[t]=SYNC.BASE[t]||{}), rc=(SYNC.RC[t]=SYNC.RC[t]||{}), seen=new Set();
    SYC[t].rows().forEach(r0=>{
      const r=syNorm(t,r0), k=SYC[t].key(r), j=syCanon(r); seen.add(k);
      const cur=base[k];
      if(cur&&cur.j===j)return;
      syRecord(t,k,rc[k]?rc[k].r:(cur?cur.r:null),r);
      /* 이미 있는 줄은 바뀐 칸만 보낸다 → 같은 회원의 다른 칸을 다른 사람이 동시에 바꿔도 둘 다 남는다 */
      const cols=(cur&&SY_PARTIAL[t])?SYC[t].cols.filter(c=>syCanon(cur.r[c])!==syCanon(r[c])):null;
      base[k]={j,r};
      if(cols&&rc[k]){ const m=Object.assign({},rc[k].r); cols.forEach(c=>m[c]=r[c]); rc[k]={j:syCanon(m),r:m}; } else rc[k]={j,r};
      syQueue(t,k,{op:"up",row:r,cols}); n++;
    });
    if(t==="staff"||t==="settings")return;         /* 강사·설정 줄은 화면에 없다고 지우지 않는다 */
    Object.keys(base).forEach(k=>{ if(seen.has(k))return;
      const old=base[k].r; syRecord(t,k,rc[k]?rc[k].r:old,null); delete base[k]; delete rc[k]; syQueue(t,k,{op:"del",row:old}); n++; });
  });
  if(n)syPushSoon();
  return n;
}
const SY_PARTIAL={staff:1,members:1,regs:1,trials:1};
const SY_NEED={staff:["name"],members:["name"]};
const SY_PK={staff:["id"],members:["id"],attendance:["member_id","day","time","teacher"],notes:["id"],contacts:["member_id","kind"],regs:["id"],trials:["id"],settings:["key"]};
function syQueue(t,k,op){
  const q=(SYNC.pend[t]=SYNC.pend[t]||new Map()), old=q.get(k);
  if(old&&old.op==="up"&&op.op==="up"){
    op.cols=(old.cols&&op.cols)?Array.from(new Set(old.cols.concat(op.cols))):null;
  }
  q.set(k,op);
}
function syPending(){ return SY_PUSH_ORDER.reduce((a,t)=>a+((SYNC.pend[t]&&SYNC.pend[t].size)||0),0); }
/* 되돌리기용 기록 — pushUndo 직후 몇 초 동안 생긴 변화를 그 항목에 묶는다 */
function syRecord(t,k,before,after){
  const u=SYNC.open; if(!u)return;
  const id=t+"\u0001"+k, c=u.rows.get(id);
  if(c)c.a=after; else u.rows.set(id,{t,k,b:before,a:after});
}

/* ── 서버로 보내기 ── */
function syPushSoon(){ clearTimeout(SYNC.retry); SYNC.retry=setTimeout(syPush,250); syPaint(); }
async function syPush(){
  if(SYNC.pushing){ SYNC.again=true; return; }
  SYNC.pushing=true; SYNC.again=false; syPaint();
  try{
    for(const t of SY_PUSH_ORDER){
      const q=SYNC.pend[t]; if(!q||!q.size)continue;
      const items=Array.from(q.entries());
      const ups=items.filter(([,o])=>o.op==="up"), dels=items.filter(([,o])=>o.op==="del");
      const conflict=SY_PK[t].join(",");
      const groups={};
      ups.forEach(it=>{ const o=it[1], sig=o.cols?(SY_NEED[t]||[]).concat(o.cols).filter((c,i,a)=>a.indexOf(c)===i).sort().join(","):"*"; (groups[sig]=groups[sig]||[]).push(it); });
      for(const sig of Object.keys(groups)){
        const g=groups[sig];
        for(let i=0;i<g.length;i+=400){
          const part=g.slice(i,i+400);
          /* 바뀐 칸만 보낼 때도 '비우면 안 되는 칸'(이름)은 같이 보낸다 — 서버는 넣기 전에 빈칸부터 검사한다 */
          const body=part.map(([,o])=>{ if(!o.cols)return o.row; const x={}; SY_PK[t].concat(SY_NEED[t]||[],o.cols).forEach(c=>x[c]=o.row[c]); return x; });
          const {error}=await SYNC.sb.from(t).upsert(body,{onConflict:conflict});
          if(error)throw error;
          part.forEach(([k,o])=>{ if(q.get(k)===o)q.delete(k); });
        }
      }
      for(let i=0;i<dels.length;i+=100){
        const part=dels.slice(i,i+100);
        let res;
        if(t==="attendance")res=await SYNC.sb.from(t).delete().in("k",part.map(([k])=>k));
        else if(t==="contacts"){ for(const [k,o] of part){ res=await SYNC.sb.from(t).delete().eq("member_id",o.row.member_id).eq("kind",o.row.kind); if(res.error)break; } }
        else res=await SYNC.sb.from(t).delete().in(t==="settings"?"key":"id",part.map(([k])=>k));
        if(res&&res.error)throw res.error;
        part.forEach(([k,o])=>{ if(q.get(k)===o)q.delete(k); });
      }
    }
    SYNC.fail=0; SYNC.status="";
  }catch(e){
    SYNC.fail++; SYNC.status="저장 안 됨 — "+(e.message||e);
    clearTimeout(SYNC.retry); SYNC.retry=setTimeout(syPush,Math.min(30000,3000*SYNC.fail));
    if(SYNC.fail===1)toast("서버에 저장하지 못했어요. 잠시 뒤 다시 보냅니다.");
  }finally{ SYNC.pushing=false; syPaint(); if((SYNC.again||syPending())&&!SYNC.fail)syPushSoon(); }
}
/* 머리글 저장 상태 */
function syPaint(){
  let el=document.getElementById("syncChip");
  if(!el){ const c=document.getElementById("authChip"); if(!c)return; el=document.createElement("span"); el.id="syncChip"; el.style.cssText="font-size:12px;white-space:nowrap"; c.insertBefore(el,c.firstChild); }
  const n=syPending();
  el.innerHTML=SYNC.status?'<span style="color:var(--red);font-weight:700" title="'+esc(SYNC.status)+'">● 저장 안 됨 '+n+'</span>':
    (n||SYNC.pushing)?'<span style="color:var(--orange)">● 저장 중</span>':'<span style="color:var(--green)">● 저장됨</span>';
}
window.addEventListener("beforeunload",e=>{ if(SYNC.on&&syPending()){ e.preventDefault(); e.returnValue=""; } });

/* ── 서버 줄(RC) → 화면 상태(S) ── */
function syRebuild(){
  const R=t=>Object.values(SYNC.RC[t]||{}).map(x=>x.r);
  const ms={};
  S.staff=R("staff").sort((a,b)=>(a.sort??999)-(b.sort??999)||String(a.name).localeCompare(String(b.name)))
    .map(r=>Object.assign({},syClone(r.extra)||{},{id:r.id,name:r.name}));
  S.members=R("members").map(r=>{
    const x=syClone(r.extra)||{}, sid=r.staff_id||x._staffId||null; delete x._staffId;
    const m=Object.assign(x,{id:r.id,name:r.name,phone:r.phone||"",staffId:sid,trashed:!!r.trashed,passes:syClone(r.passes)||[],att:[],notes:[],acts:{}});
    if(r.birth!=null)m.birth=r.birth; if(r.addr!=null)m.addr=r.addr;
    if(r.birth_hand)m.birthHand=true; if(r.addr_hand)m.addrHand=true;
    if(r.trash_at!=null)m.trashAt=r.trash_at; if(r.trash_by!=null)m.trashBy=r.trash_by;
    if(r.excel_memo!=null)m.memo=r.excel_memo;
    if(r.doc_order&&r.doc_order.length)m.docOrder=syClone(r.doc_order);
    ms[m.id]=m; return m;
  }).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ko")||String(a.id).localeCompare(String(b.id)));   /* 서버는 줄 순서를 보장하지 않으니 모든 기기에서 같은 순서로 */
  R("attendance").forEach(r=>{ const m=ms[r.member_id]; if(m)m.att.push({date:r.day,time:r.time,teacher:r.teacher,end:r.end_time}); });
  R("notes").forEach(r=>{ const m=ms[r.member_id]; if(!m)return; const n={id:r.id,d:r.day,t:r.body,by:r.by_name||"",at:r.created_at}; if(r.kind)n.kind=r.kind; m.notes.push(n); });
  R("contacts").forEach(r=>{ const m=ms[r.member_id]; if(m)m.acts[r.kind]={d:r.day,rem:r.rem,by:r.by_name||""}; });
  S.members.forEach(m=>{
    m.att.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:toMin(a.time)-toMin(b.time));
    m.notes.sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:(a.d<b.d?1:a.d>b.d?-1:0));   /* 이 컴퓨터에서처럼 '쓴 순서' 그대로 */
  });
  S.regs=R("regs").map(r=>Object.assign({},syClone(r.extra)||{},{id:r.id})).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(b.id).localeCompare(String(a.id)));
  S.trials=R("trials").map(r=>{ const t=Object.assign({},syClone(r.data)||{},{id:r.id}); if(r.sign)t.sign=syClone(r.sign); return t; });
  S.lessons={};
  R("settings").forEach(r=>{ if(SY_SETTINGS.indexOf(r.key)>=0&&r.value!=null)S[r.key]=syClone(r.value);
    else if(/^les:\d{4}-\d\d$/.test(r.key)&&r.value)S.lessons[r.key.slice(4)]=syClone(r.value); });
  SY_TABLES.forEach(t=>{ SYNC.BASE[t]=Object.assign({},SYNC.RC[t]||{}); });
  clearCache();
}
/* 다른 기기 변경을 받은 뒤 화면 다시 그리기 — 글을 쓰는 중이면 기다린다 */
function syRebuildSoon(){
  clearTimeout(SYNC.rebuildTimer);
  SYNC.rebuildTimer=setTimeout(()=>{
    /* 화면 안에서 글을 쓰는 중이면(메모 칸 등) 다 쓸 때까지 기다린다 — 다 쓰고 칸을 벗어나면 바로 반영 */
    const a=document.activeElement;
    const typing=a&&a.closest&&a.closest("#main,#drawer,#docpane,#pop")&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&/^(text|search|tel|number|)$/.test(a.type||"")))&&String(a.value||"").length>0;
    if(typing||S.editMemo||(typeof TD!=="undefined"&&TD)){ SYNC.waitRebuild=true; return; }
    SYNC.waitRebuild=false;
    syFlush(); syRebuild(); render();
  },400);
}

document.addEventListener("focusout",()=>{ if(SYNC.waitRebuild)setTimeout(syRebuildSoon,50); });
setInterval(()=>{ if(SYNC.waitRebuild)syRebuildSoon(); },3000);

/* ── 불러오기 ── */
async function syFetchAll(t){
  const out=[]; let from=0;
  for(;;){
    const {data,error}=await SYNC.sb.from(t).select(SYC[t]?SYC[t].cols.join(","):"*").range(from,from+999);
    if(error)throw error;
    out.push(...data); if(data.length<1000)break; from+=1000;
  }
  return out;
}
async function syLoad(){
  for(const t of SY_TABLES){
    const rows=await syFetchAll(t), rc={};
    rows.forEach(r0=>{ const r=syNorm(t,r0); rc[SYC[t].key(r)]={j:syCanon(r),r}; });
    SYNC.RC[t]=rc;
  }
  syRebuild();
  SYNC.loaded=true;
  /* 화면에서 만든 모양(메모 id 등)과 서버 모양이 다르면 여기서 한 번 맞춘다 */
  syFlush();
}
function sySubscribe(){
  const ch=SYNC.sb.channel("relaxdesk");
  SY_TABLES.concat(["docs"]).forEach(t=>{
    ch.on("postgres_changes",{event:"*",schema:"public",table:t},p=>syRemote(t,p));
  });
  ch.subscribe(st=>{ if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")SYNC.status="실시간 연결 끊김 — 새로고침하면 다시 연결돼요"; syPaint(); });
  SYNC.chan=ch;
}
function syRemote(t,p){
  if(t==="docs"){ syDocRemote(p); return; }
  const ev=p.eventType, src=ev==="DELETE"?p.old:p.new; if(!src)return;
  const pk=SYC[t].key(syNorm(t,Object.assign({},src)));
  const rc=SYNC.RC[t], mine=SYNC.pend[t]&&SYNC.pend[t].get(pk);
  if(ev==="DELETE"){ if(mine)return; if(!rc[pk])return; delete rc[pk]; }
  else{
    /* 큰 칸(수강권 목록 등)이 안 바뀌었으면 서버 알림에서 빠질 수 있다 → 빠진 칸은 갖고 있던 값을 쓴다 */
    const prev=rc[pk]?rc[pk].r:null;
    let r=syNorm(t,prev?Object.assign({},prev,src):src);
    if(mine){                                            /* 내가 보내는 중인 칸은 내 값을 남기고, 나머지 칸은 서버 값으로 */
      if(mine.op==="del"||!mine.cols)return;
      r=Object.assign({},r); mine.cols.forEach(c=>r[c]=mine.row[c]);
    }
    const j=syCanon(r); if(rc[pk]&&rc[pk].j===j)return; rc[pk]={j,r};
  }
  /* 체험은 글을 쓰는 중에도 그림·서명이 바로 보여야 한다 — 전체를 다시 그리기 전에 그 칸만 합쳐서 고친다 */
  if(t==="trials"&&ev!=="DELETE"&&trMergeRC()){ const x=trFind(pk); if(x)trRepaint(x); else if(S.signList)paintSign(); }
  syRebuildSoon();
}

/* ── 되돌리기 (내가 바꾼 줄만) ── */
function syPushUndo(label){
  if(SYNC.open)SYNC.open.live=false;
  const u={label:label||"",at:Date.now(),rows:new Map(),live:true};
  undoStack.push(u); if(undoStack.length>UNDO_MAX)undoStack.shift();
  redoStack=[];
  SYNC.open=u; clearTimeout(SYNC.openTimer);
  SYNC.openTimer=setTimeout(()=>{ if(SYNC.open===u){ syFlush(); SYNC.open=null; } },4000);
}
function syApplyBack(u,dir){
  syFlush();
  if(SYNC.open){ SYNC.open=null; }
  let done=0, skip=0; const back={label:u.label,at:u.at,rows:new Map()};
  u.rows.forEach(c=>{
    const want=dir==="undo"?c.b:c.a, was=dir==="undo"?c.a:c.b;
    const rc=SYNC.RC[c.t], cur=rc[c.k]?rc[c.k].r:null;
    /* 회원·등록처럼 칸이 많은 줄은 '내가 바꾼 칸'만 본다 — 같은 회원의 다른 칸을 남이 바꿨어도 내 것은 되돌린다 */
    if(want&&was&&cur&&SY_PARTIAL[c.t]){
      const cols=SYC[c.t].cols.filter(k=>syCanon(want[k])!==syCanon(was[k]));
      if(cols.some(k=>syCanon(cur[k])!==syCanon(was[k]))){ skip++; return; }
      const nr=Object.assign({},cur); cols.forEach(k=>nr[k]=want[k]);
      rc[c.k]={j:syCanon(nr),r:nr}; if(cols.length)syQueue(c.t,c.k,{op:"up",row:nr,cols});
      back.rows.set(c.t+"\u0001"+c.k,c); done++; return;
    }
    if(syCanon(cur)!==syCanon(was)){ skip++; return; }      /* 그사이 다른 사람이 바꿈 → 건드리지 않음 */
    if(want){ rc[c.k]={j:syCanon(want),r:want}; syQueue(c.t,c.k,{op:"up",row:want}); }
    else{ delete rc[c.k]; syQueue(c.t,c.k,{op:"del",row:cur}); }
    back.rows.set(c.t+"\u0001"+c.k,c); done++;
  });
  syRebuild(); render(); syPushSoon();
  return {done,skip,back};
}
function syDoUndo(){
  const u=undoStack.pop(); if(!u){ toast("되돌릴 게 없어요."); return; }
  if(!u.rows){ toast("되돌릴 수 없는 항목이에요."); return; }
  const r=syApplyBack(u,"undo"); redoStack.push(r.back);
  toast((u.label?u.label+" — ":"")+"되돌렸어요"+(r.skip?" · 그사이 다른 사람이 바꾼 "+r.skip+"건은 그대로 뒀어요":""));
}
function syDoRedo(){
  const u=redoStack.pop(); if(!u){ toast("다시 할 게 없어요."); return; }
  const r=syApplyBack(u,"redo"); undoStack.push(r.back);
  toast((u.label?u.label+" — ":"")+"다시 했어요"+(r.skip?" · "+r.skip+"건은 그사이 바뀌어 그대로 뒀어요":""));
}

/* ── 자료(사진·PDF) — 서버 비공개 저장소 ── */
const SYD={blobs:new Map(),loading:new Set()};
const syDocRow=d=>({id:d.id,member_id:d.memberId,day:syIsD(d.date),kind:d.kind||null,is_pdf:!!d.pdf,
  files:(d.pages||[]).map(p=>({path:p.path,w:p.w||null,h:p.h||null})),fname:d.fname||null,by_name:d.by||null,created_at:syTs(d.savedAt)||new Date().toISOString()});
function syDocFromRow(r){
  const mm=(S.members||[]).find(m=>m.id===r.member_id)||(S.trials||[]).find(t=>t.id===r.member_id);
  return {id:r.id,memberId:r.member_id,member:mm?mm.name:"",date:r.day,kind:r.kind,savedAt:r.created_at,by:r.by_name||"",pdf:!!r.is_pdf,fname:r.fname||undefined,
    pages:(r.files||[]).map(f=>({path:f.path,w:f.w,h:f.h,pdf:!!r.is_pdf,blob:SYD.blobs.get(f.path)}))};
}
async function syDocsLoad(){
  const {data,error}=await SYNC.sb.from("docs").select("*");
  if(error)throw error;
  DOCS.db={hosted:true}; DOCS.dir=null;
  DOCS.list=(data||[]).map(syDocFromRow);
  DOCS.ready=true; DOCS.failed=false;
}
async function syDocPut(rec){
  const ext=rec.pdf?"pdf":"jpg";
  for(let i=0;i<rec.pages.length;i++){
    const p=rec.pages[i];
    if(!p.path){
      const path=rec.memberId+"/"+rec.id+"/"+(i+1)+"."+ext;
      const {error}=await SYNC.sb.storage.from("docs").upload(path,p.blob,{upsert:true,contentType:rec.pdf?"application/pdf":"image/jpeg"});
      if(error)throw new Error("파일을 올리지 못했어요: "+error.message);
      p.path=path; SYD.blobs.set(path,p.blob);
    }
  }
  const {error}=await SYNC.sb.from("docs").upsert(syDocRow(rec),{onConflict:"id"});
  if(error)throw new Error(error.message);
}
async function syDocDel(id){
  const d=DOCS.list.find(x=>x.id===id);
  const {error}=await SYNC.sb.from("docs").delete().eq("id",id);
  if(error)throw new Error(error.message);
  if(d){ const paths=d.pages.map(p=>p.path).filter(Boolean); if(paths.length)await SYNC.sb.storage.from("docs").remove(paths); }
}
/* 화면에 보일 때 그 쪽 파일만 받아온다 */
function syDocBlob(d,p){
  const pg=d.pages[p]; if(!pg)return null;
  if(pg.blob)return pg.blob;
  const path=pg.path; if(!path)return null;
  if(SYD.blobs.has(path)){ pg.blob=SYD.blobs.get(path); return pg.blob; }
  if(!SYD.loading.has(path)){
    SYD.loading.add(path);
    SYNC.sb.storage.from("docs").download(path).then(({data,error})=>{
      SYD.loading.delete(path);
      if(error||!data){ toast("자료를 불러오지 못했어요."); return; }
      SYD.blobs.set(path,data); pg.blob=data; paintDocs(); paintDocFull();
    });
  }
  return null;
}
function syDocRemote(p){
  const ev=p.eventType;
  if(ev==="DELETE"){ const id=p.old&&p.old.id; if(!id)return; DOCS.list=DOCS.list.filter(x=>x.id!==id); }
  else{ const r=p.new; if(!r)return; const d=syDocFromRow(r), i=DOCS.list.findIndex(x=>x.id===r.id);
    if(i>=0){ d.pages.forEach((pg,k)=>{ const old=DOCS.list[i].pages[k]; if(old&&old.blob&&old.path===pg.path)pg.blob=old.blob; }); DOCS.list[i]=d; } else DOCS.list.push(d); }
  syRebuildSoon();
}

/* ── 새 버전 알림 (인터넷 주소로 열었을 때만) ──
   몇 분마다 사이트 파일을 새로 받아 버전 번호를 비교한다. 더 높으면 위쪽에 띠를 띄운다.
   cache:"reload"로 받으므로 브라우저 저장본도 새 파일로 바뀐다 → 띠를 누르면 바로 새 버전이 열린다. */
const APP_VER=(()=>{ const b=document.querySelector(".brand span"); const m=b&&b.textContent.match(/v(\d+)/); return m?+m[1]:0; })();
let NEWVER=null;
async function checkNewVersion(){
  if(!HOSTED||NEWVER)return;
  try{
    const r=await fetch(location.pathname,{cache:"reload"}); if(!r.ok)return;
    const m=(await r.text()).match(/<span>v(\d+) · [^<]*만듦<\/span>/);
    if(m&&+m[1]>APP_VER){ NEWVER=+m[1]; paintNewVer(); }
  }catch(e){}
}
function paintNewVer(){
  let el=document.getElementById("newVer");
  if(!el){ el=document.createElement("div"); el.id="newVer";
    el.style.cssText="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:300;background:var(--navy);color:#fff;"+
      "border-radius:22px;padding:8px 10px 8px 16px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(20,30,50,.25);display:flex;gap:10px;align-items:center";
    document.body.appendChild(el); }
  el.innerHTML='새 버전(v'+NEWVER+')이 올라왔어요'+
    '<button style="border:0;border-radius:16px;background:#fff;color:var(--navy);font:inherit;font-weight:800;padding:5px 12px;cursor:pointer">새로고침</button>';
  el.querySelector("button").onclick=async()=>{
    /* 아직 서버에 못 보낸 변경이 있으면 먼저 보낸다 */
    if(SYNC.on){ syFlush(); for(let i=0;i<40&&(syPending()||SYNC.pushing);i++){ if(!SYNC.pushing&&syPending())syPush(); await new Promise(r=>setTimeout(r,250)); } }
    location.reload();
  };
}
if(HOSTED){
  setInterval(checkNewVersion,3*60*1000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible")checkNewVersion(); });
  setTimeout(checkNewVersion,20000);
}

    SYNC.status="불러오기 실패"; syPaint(); return;
  }

/* ── 처음 한 번: 이전 파일로 서버 채우기 (관리자, 서버가 비어 있을 때만) ── */
function syOfferImport(){
  $("pop").innerHTML='<div class="popbox"><div class="poph"><div class="t">서버가 비어 있어요</div>'+
    '<div class="s">회사 컴퓨터에서 받은 <b>서버 이전 파일</b>(또는 백업 파일)을 넣으면 회원·수업·메모·등록·체험·자료가 서버로 들어갑니다. 한 번만 하면 돼요.</div></div>'+
    '<div style="padding:12px 20px 18px;display:flex;flex-direction:column;gap:8px">'+
    '<button class="btn navy" style="height:40px" id="syImpBtn">이전 파일 고르기</button>'+
    '<button class="btn" data-a="closepop">나중에</button>'+
    '<div class="note" id="syImpMsg"></div></div></div>';
  $("pop").classList.add("on");
  document.getElementById("syImpBtn").onclick=()=>{
    const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange=()=>{ if(i.files[0])syImport(i.files[0]); }; i.click();
  };
}
async function syImport(file){
  const msg=t=>{ const e=document.getElementById("syImpMsg"); if(e)e.innerHTML=t; };
  try{
    if(Object.keys(SYNC.RC.members).length)throw new Error("서버에 이미 회원이 있어요. 두 번 넣지 않게 막았어요.");
    msg("파일을 읽는 중…");
    const j=JSON.parse(await file.text());
    let d=null;
    if(j&&j.kind==="relaxdesk-migration")d=j.data;
    else if(j&&j._localStorage&&j._localStorage[KEY])d=JSON.parse(j._localStorage[KEY]);
    else if(j&&Array.isArray(j.members))d=j;
    if(!d||!Array.isArray(d.members))throw new Error("릴렉싱데스크 백업·이전 파일이 아니에요.");
    /* 0) 열 때 보낸 정리 내용이 다 올라갈 때까지 기다린다 (강사 id를 바꾸는 중에 옛 id로 다시 써지지 않게) */
    syFlush(); for(let w=0;(syPending()||SYNC.pushing)&&w<50;w++){ if(!SYNC.pushing&&syPending())syPush(); await new Promise(r=>setTimeout(r,200)); }
    /* 1) 강사: 서버 계정과 이름이 같으면 프로그램의 강사 id로 맞춘다 */
    const staff=d.staff||[];
    for(const s of staff){
      const hit=Object.values(SYNC.RC.staff).map(x=>x.r).find(r=>normName(r.name)===normName(s.name)&&r.id!==s.id);
      if(hit){ const {error}=await SYNC.sb.from("staff").update({id:s.id}).eq("id",hit.id); if(error)throw error;
        const x=SYNC.RC.staff[hit.id]; delete SYNC.RC.staff[hit.id]; delete (SYNC.BASE.staff||{})[hit.id]; if(SYNC.pend.staff)SYNC.pend.staff.delete(hit.id); x.r=Object.assign({},x.r,{id:s.id}); x.j=syCanon(x.r); SYNC.RC.staff[s.id]=x;
        if(SYNC.me&&SYNC.me.id===hit.id)SYNC.me.id=s.id; }
    }
    /* 2) 프로그램 상태로 바꾼 뒤 통째로 올린다 */
    S.staff=staff; S.members=unpackAtt(d.members||[],d.tnames||[]); S.regs=d.regs||[]; S.trials=Array.isArray(d.trials)?d.trials:[];
    SY_SETTINGS.forEach(k=>{ if(d[k]!=null)S[k]=d[k]; });
    if(d.lessons&&typeof d.lessons==="object")S.lessons=d.lessons;
    SYNC.open=null;
    const n=syFlush();
    msg("회원·수업·메모를 올리는 중… ("+n+"줄)");
    while(syPending()||SYNC.pushing){ if(SYNC.fail>2)throw new Error(SYNC.status); await new Promise(r=>setTimeout(r,400)); if(!SYNC.pushing&&syPending())syPush(); }
    /* 3) 자료 */
    const docs=(j.kind==="relaxdesk-migration"&&Array.isArray(j.docs))?j.docs:[];
    let k=0;
    for(const x of docs){
      k++; msg("자료 올리는 중… "+k+" / "+docs.length);
      const pages=x.pages.map(p=>{ const bin=atob(p.b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        return {w:p.w,h:p.h,pdf:!!p.pdf,blob:new Blob([u],{type:p.pdf?"application/pdf":"image/jpeg"})}; });
      const rec={id:x.id,memberId:x.memberId,member:x.member,date:x.date,kind:x.kind,savedAt:x.savedAt,by:x.by,pdf:!!x.pdf,fname:x.fname,pages};
      await syDocPut(rec); docListPut(rec);
    }
    syRebuild(); render();
    msg("끝났어요. 회원 "+S.members.length+"명 · 자료 "+docs.length+"건"+(docs.length?"":" (자료는 이전 파일에만 들어 있어요)"));
    /* 끝나면 창 모양도 '끝남'으로 — 다시 고르기 버튼은 없애고 닫기만 남긴다 */
    { const t=document.querySelector("#pop .poph .t"), sb=document.getElementById("syImpBtn"), cl=document.querySelector('#pop [data-a="closepop"]');
      if(t)t.textContent="서버로 옮겼어요"; if(sb)sb.remove(); if(cl){ cl.textContent="닫기"; cl.classList.add("navy"); } }
    toast("서버로 옮겼어요.");
  }catch(e){ msg('<span style="color:var(--red)">'+esc(e.message||String(e))+'</span>'); }
}

function applyBoxMode(){

function boot(){
  if(window.__SHARE__){
    const d=window.__SHARE__;
    S.staff=d.staff||[]; S.members=unpackAtt(d.members||[],d.tnames||[]); S.regs=d.regs||[]; S.trials=d.trials||[];
    S.ro=true; document.body.classList.add("ro");

    b.textContent="보기 전용 · "+String(d.at||"").slice(0,16).replace("T"," ")+" 기준";

  .agbox input{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:15px;box-sizing:border-box}
  .agbox input:focus{outline:2px solid var(--navy);border-color:transparent}
  .agbox button.go{width:100%;height:44px;margin-top:18px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .agbox button.go:disabled{opacity:.6;cursor:wait}
  .agbox .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;line-height:1.5}
  .agbox .hint{font-size:11.5px;color:var(--fnt);margin-top:14px;line-height:1.55}
  #authChip{display:none;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
  #authChip.on{display:inline-flex}
  #authChip b{color:var(--ink);white-space:nowrap} #authChip .btn{white-space:nowrap;padding:0 8px}
  .acct table{width:100%;border-collapse:collapse;font-size:13px}
  .acct th,.acct td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:left}
  .acct th{font-size:11.5px;color:var(--mut2)}
  .acct .off td{color:var(--fnt)}
  .acct form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:12px}
  .acct form input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 9px;font:inherit;font-size:13px;min-width:0}
  @media(max-width:560px){.acct form{grid-template-columns:1fr 1fr}}
</style>
<div id="authGate"><div class="agbox" id="agBox"></div></div>
<script>
(function(){
  if(!/^https?:$/.test(location.protocol))return;          /* 내 컴퓨터 파일로 열면 로그인 없이 */
  const SB_URL="https://fmknjrdjsxpicpmkgwac.supabase.co";
  const SB_KEY="sb_publishable_ojLfHTbYRXizLNBpzoRXkg_ak6kcVOk";  /* 공개용 키 — 서버 권한 설정이 데이터를 지킨다 */
  const ID_DOMAIN="@ravida-desk.com";
  const gate=document.getElementById("authGate"), box=document.getElementById("agBox");
  const digits=v=>String(v||"").replace(/\D/g,"");
  const fmt=p=>{ p=digits(p); return p.length===11?p.slice(0,3)+"-"+p.slice(3,7)+"-"+p.slice(7):p; };
  const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  window.AUTH={sb:null,user:null,staff:null};
  gate.classList.add("on");
  box.innerHTML='<h1>릴렉싱 데스크</h1><div class="s">불러오는 중…</div>';

  /* 로그인 화면 */
  function showLogin(msg){
    gate.classList.add("on");
    box.innerHTML='<h1>릴렉싱 데스크</h1><div class="s">강사 계정으로 로그인하세요</div>'+
      '<form id="agForm" autocomplete="on"><label>휴대폰 번호</label><input id="agPhone" inputmode="numeric" autocomplete="username" placeholder="01012345678">'+
      '<label>비밀번호</label><input id="agPw" type="password" autocomplete="current-password">'+
      '<button class="go" id="agGo" type="submit">로그인</button><div class="err" id="agErr">'+h(msg||"")+'</div></form>'+
      '<div class="hint">비밀번호를 잊었으면 파트장에게 임시 비밀번호를 받으세요.</div>';
    const ph=document.getElementById("agPhone"); ph.focus();
    document.getElementById("agForm").onsubmit=async e=>{
      e.preventDefault();
      const p=digits(ph.value), pw=document.getElementById("agPw").value, err=document.getElementById("agErr"), go=document.getElementById("agGo");
      if(p.length<10){ err.textContent="휴대폰 번호를 확인해주세요."; return; }
      if(!pw){ err.textContent="비밀번호를 넣어주세요."; return; }
      go.disabled=true; go.textContent="확인 중…"; err.textContent="";
      const {error}=await AUTH.sb.auth.signInWithPassword({email:p+ID_DOMAIN,password:pw});
      go.disabled=false; go.textContent="로그인";
      if(error){ err.textContent=/invalid/i.test(error.message)?"번호나 비밀번호가 맞지 않아요.":/banned|disabled/i.test(error.message)?"사용이 정지된 계정이에요.":"로그인하지 못했어요: "+error.message; return; }
      await afterLogin();
    };
  }
  /* 첫 로그인·임시 비밀번호면 새 비밀번호로 바꾸게 한다 */
  function showChangePw(force){
    gate.classList.add("on");
    box.innerHTML='<h1>새 비밀번호</h1><div class="s">'+(force?"임시 비밀번호로 들어왔어요. 바꾸고 싶으면 새 비밀번호를 넣고, 그대로 쓰려면 맨 아래를 누르세요.":"비밀번호를 바꿉니다.")+'</div>'+
      '<form id="agForm"><label>새 비밀번호 (8자 이상)</label><input id="agPw1" type="password" autocomplete="new-password">'+
      '<label>한 번 더</label><input id="agPw2" type="password" autocomplete="new-password">'+
      '<button class="go" id="agGo" type="submit">바꾸기</button><div class="err" id="agErr"></div></form>'+
      (force?'<button class="go" id="agKeep" type="button" style="background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px">지금 비밀번호 그대로 쓰기</button>'+
        '<div class="hint">나중에 머리글의 ‘비밀번호’에서 언제든 바꿀 수 있어요.</div>':'<div class="hint"><a href="#" id="agCancel">취소</a></div>');
    document.getElementById("agPw1").focus();
    const c=document.getElementById("agCancel"); if(c)c.onclick=e=>{e.preventDefault(); gate.classList.remove("on");};
    /* 바꾸지 않고 그대로 쓰기 — 다음 로그인부터는 묻지 않는다 */
    const k=document.getElementById("agKeep");
    if(k)k.onclick=async()=>{ k.disabled=true;
      const {error}=await AUTH.sb.auth.updateUser({data:{must_change:false}});
      if(error){ k.disabled=false; document.getElementById("agErr").textContent="저장하지 못했어요: "+error.message; return; }
      gate.classList.remove("on"); startSync(); };
    document.getElementById("agForm").onsubmit=async e=>{
      e.preventDefault();
      const a=document.getElementById("agPw1").value, b=document.getElementById("agPw2").value, err=document.getElementById("agErr");
      if(a.length<8){ err.textContent="8자 이상으로 정해주세요."; return; }
      if(a!==b){ err.textContent="두 칸이 서로 달라요."; return; }
      const {error}=await AUTH.sb.auth.updateUser({password:a,data:{must_change:false}});
      if(error){ err.textContent="바꾸지 못했어요: "+error.message; return; }
      gate.classList.remove("on"); if(window.toast)toast("비밀번호를 바꿨어요."); startSync();
    };
  }
  let started=false;
  function startSync(){ if(started||!window.SYNC_START)return; started=true; window.SYNC_START(AUTH.sb,AUTH.staff); }
  async function afterLogin(){
    const {data:{user}}=await AUTH.sb.auth.getUser();
    if(!user){ showLogin(); return; }
    AUTH.user=user;
    const {data,error}=await AUTH.sb.from("staff").select("id,name,phone,is_admin,active").eq("auth_user",user.id).maybeSingle();
    if(error||!data){ await AUTH.sb.auth.signOut(); showLogin(error?"서버에 연결하지 못했어요: "+error.message:"강사 목록에 연결되지 않은 계정이에요. 파트장에게 문의하세요."); return; }
    if(!data.active){ await AUTH.sb.auth.signOut(); showLogin("사용이 정지된 계정이에요."); return; }
    AUTH.staff=data;
    paintChip();
    if(user.user_metadata&&user.user_metadata.must_change){ showChangePw(true); return; }
    gate.classList.remove("on"); if(document.activeElement)document.activeElement.blur(); startSync();
  }
  /* 머리글: 이름 · 계정 관리 · 비밀번호 · 로그아웃 */
  function paintChip(){
    let c=document.getElementById("authChip");
    if(!c){ c=document.createElement("span"); c.id="authChip"; const r=document.querySelector(".hright"); if(r)r.insertBefore(c,r.firstChild); }
    c.innerHTML='<b>'+h(AUTH.staff.name)+'</b>'+
      (AUTH.staff.is_admin?'<button class="btn sm gh" id="acctBtn">계정 관리</button>':'')+
      '<button class="btn sm gh" id="pwBtn">비밀번호</button><button class="btn sm gh" id="outBtn">로그아웃</button>';
    c.classList.add("on");
    document.getElementById("outBtn").onclick=async()=>{
      if(window.syPending&&syPending()&&!confirm("아직 서버에 못 보낸 변경이 있어요. 그래도 로그아웃할까요?"))return;
      await AUTH.sb.auth.signOut(); location.reload(); };
    document.getElementById("pwBtn").onclick=()=>showChangePw(false);
    const a=document.getElementById("acctBtn"); if(a)a.onclick=openAccounts;
  }

  /* ── 계정 관리 (관리자만) — 실제 처리는 서버 함수 admin-users가 관리자 여부를 다시 확인하고 한다 ── */
  async function callAdmin(body){
    const {data,error}=await AUTH.sb.functions.invoke("admin-users",{body});
    if(error){ let m=error.message; try{ const j=await error.context.json(); if(j&&j.error)m=j.error; }catch(e){} throw new Error(m); }
    if(data&&data.error)throw new Error(data.error);
    return data;
  }
  const pop=()=>document.getElementById("pop");
  window.openAccounts=()=>openAccounts();
  async function openAccounts(){
    pop().innerHTML='<div class="popbox" style="max-width:640px"><div class="poph"><div class="t">계정 관리</div><div class="s">불러오는 중…</div></div></div>';
    pop().classList.add("on");
    let list=[];
    try{ list=(await callAdmin({action:"list"})).staff||[]; }
    catch(e){ pop().innerHTML='<div class="popbox"><div class="poph"><div class="t">계정 관리</div><div class="s" style="color:var(--red)">'+h(e.message)+'</div></div>'+
      '<div style="padding:10px 20px 18px"><div class="note">서버 함수(admin-users)가 아직 없으면 이 메시지가 떠요. 안내에 따라 함수를 먼저 올려주세요.</div><button class="btn" style="margin-top:10px" data-a="closepop">닫기</button></div></div>'; return; }
    const me=AUTH.staff.phone;
    let t='<div class="popbox" style="max-width:640px"><div class="poph"><div class="t">계정 관리</div><div class="s">아이디는 휴대폰 번호예요. 임시 비밀번호로 처음 들어오면 본인이 새 비밀번호로 바꿉니다.</div></div>'+
      '<div class="acct" style="padding:6px 20px 18px"><table><thead><tr><th>이름</th><th>아이디(번호)</th><th>마지막 로그인</th><th></th></tr></thead><tbody>'+
      list.filter(s=>s.auth_user).map(s=>'<tr class="'+(s.active?"":"off")+'"><td>'+h(s.name)+(s.is_admin?' <span class="tag n">관리자</span>':'')+(s.active?'':' <span class="tag r">정지</span>')+'</td>'+
        '<td>'+h(fmt(s.phone))+'</td><td>'+(s.last_sign_in_at?h(new Date(s.last_sign_in_at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})):'<span style="color:var(--fnt)">없음</span>')+'</td>'+
        '<td style="text-align:right;white-space:nowrap">'+(s.phone===me?'<span style="color:var(--fnt);font-size:12px">나</span>':
          '<button class="btn sm gh" data-acct="reset" data-p="'+h(s.phone)+'">임시 비번</button> '+
          (s.active?'<button class="btn sm gh" data-acct="disable" data-p="'+h(s.phone)+'">정지</button>':'<button class="btn sm gh" data-acct="enable" data-p="'+h(s.phone)+'">다시 쓰기</button>'))+'</td></tr>').join("")+
      '</tbody></table>'+
      (()=>{ const no=list.filter(s=>!s.auth_user); return no.length?'<div class="note" style="margin-top:10px">계정 없는 강사: <b>'+no.map(s=>h(s.name)).join(', ')+'</b> — 아래에서 <b>똑같은 이름</b>으로 추가하면 그 강사 줄에 연결돼서 책임 회원·메모 기록이 이어져요.</div>':''; })()+
      '<form id="acctAdd"><input name="name" placeholder="이름 (예: 강다은)"><input name="phone" inputmode="numeric" placeholder="휴대폰 번호"><input name="pw" placeholder="임시 비밀번호 (8자+)"><button class="btn navy" type="submit">계정 추가</button></form>'+
      '<div class="err" id="acctErr" style="color:var(--red);font-size:12.5px;min-height:16px;margin-top:8px"></div>'+
      '<div style="text-align:right"><button class="btn" data-a="closepop">닫기</button></div></div></div>';
    pop().innerHTML=t;
    const err=document.getElementById("acctErr");
    document.getElementById("acctAdd").onsubmit=async e=>{
      e.preventDefault(); const f=e.target, name=f.name.value.trim(), phone=digits(f.phone.value), pw=f.pw.value;
      if(!name){ err.textContent="이름을 넣어주세요."; return; }
      if(phone.length<10){ err.textContent="휴대폰 번호를 확인해주세요."; return; }
      if(pw.length<8){ err.textContent="임시 비밀번호는 8자 이상이에요."; return; }
      if(list.some(s=>s.phone===phone)){ err.textContent="이미 있는 번호예요."; return; }
      err.textContent="만드는 중…";
      try{ const r=await callAdmin({action:"create",name,phone,password:pw}); if(window.toast)toast(name+" 계정을 만들었어요 · 아이디 "+fmt(phone)+(r&&r.linked?" · 기존 강사 기록과 연결":"")); openAccounts(); }
      catch(x){ err.textContent=x.message; }
    };
    pop().querySelectorAll("[data-acct]").forEach(b=>b.onclick=async()=>{
      const a=b.dataset.acct, phone=b.dataset.p, who=(list.find(s=>s.phone===phone)||{}).name||phone;
      try{
        if(a==="reset"){
          const pw=prompt(who+"님 임시 비밀번호 (8자 이상)"); if(!pw)return;
          if(pw.length<8){ err.textContent="임시 비밀번호는 8자 이상이에요."; return; }
          await callAdmin({action:"reset",phone,password:pw}); if(window.toast)toast(who+"님 임시 비밀번호를 정했어요. 처음 들어올 때 바꾸게 됩니다.");
        }else if(a==="disable"){
          if(!confirm(who+"님 계정을 정지할까요? 바로 로그인할 수 없게 됩니다."))return;
          await callAdmin({action:"disable",phone}); if(window.toast)toast(who+"님 계정을 정지했어요.");
        }else if(a==="enable"){
          await callAdmin({action:"enable",phone}); if(window.toast)toast(who+"님 계정을 다시 쓸 수 있어요.");
        }
        openAccounts();
      }catch(x){ err.textContent=x.message; }
    });
  }

  /* 시작 */
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
  s.onload=async()=>{
    AUTH.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    AUTH.sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT"&&AUTH.staff){ location.reload(); } });
    const {data:{session}}=await AUTH.sb.auth.getSession();
    if(session)await afterLogin(); else showLogin();
  };
  s.onerror=()=>{ box.innerHTML='<h1>릴렉싱 데스크</h1><div class="err">인터넷에 연결되지 않아 로그인할 수 없어요.</div>'; };
  document.head.appendChild(s);
})();
</script>

</body>
