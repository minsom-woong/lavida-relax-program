function dropOk(cell){
  const col=cell.dataset.col;
  if(!col||col==="stop"||col==="far")return false;
  /* 지난 기록 표와 예측 표 사이는 서로 옮길 수 없다.
     이번 달은 양쪽에 다 있으므로 칸에 붙은 표시로 가른다. */
  return (cell.dataset.past==="1")===!!dragReg;
}
document.addEventListener("dragover",e=>{
  const cell=e.target.closest(".cell"); if(!cell||!dropOk(cell))return;
  e.preventDefault();
});
document.addEventListener("dragenter",e=>{
  const cell=e.target.closest(".cell"); if(!cell||!dropOk(cell))return;
  cell.classList.add("over");
});
document.addEventListener("dragleave",e=>{
  const cell=e.target.closest(".cell"); if(!cell)return;
  if(!cell.contains(e.relatedTarget))cell.classList.remove("over");
});
document.addEventListener("drop",e=>{
  const cell=e.target.closest(".cell"); if(!cell)return;
  e.preventDefault();
  cell.classList.remove("over");
  const ok=dropOk(cell), col=cell.dataset.col, regId=dragReg;
  if(ok&&!S.ro)pushUndo(regId?"등록 월 수정":"예상 달 옮기기");
  const id=dragId||e.dataTransfer.getData("text/plain");
  dragId=null; dragReg=null;
  if(!ok)return;
  if(regId){
    /* 과거 칸 = 실제 등록 기록의 월을 고치는 것 */
    const r=S.regs.find(x=>x.id===regId); if(!r)return;
    if((r.staffId||"")!==(cell.dataset.staff||""))return;
    if(r.ym===col)return;
    const before=r.ym;
    const dd=/^\d{4}-\d{2}-(\d{2})$/.exec(String(r.date||""));
    r.ym=col;
    r.date=col+"-"+(dd?dd[1]:"01");
    logAct("등록 월 수정",r.name+" "+ymLabel(before)+" → "+ymLabel(col));
    save(); render();
    toast(r.name+" 등록을 "+ymLabel(col)+"로 옮겼어요");
    return;
  }
  const m=byId(S.members,id); if(!m)return;
  if((m.staffId||"")!==(cell.dataset.staff||""))return; // 다른 강사 줄로는 이동 안 됨
  if(m.forceYm===col)return;
  m.forceYm=col;
  logAct("예상 월 지정",m.name+" → "+ymLabel(col));
  save(); render();
  toast(m.name+" → "+ymLabel(col)+"로 옮겼어요");
});

document.addEventListener("keydown",e=>{
  const t=e.target;
  if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z"||e.key==="y"||e.key==="Y")){
    const tag=(e.target&&e.target.tagName)||"";
    /* 글 쓰는 칸 안에서는 브라우저 기본 되돌리기(글자 단위)를 쓴다 */
    if(tag!=="INPUT"&&tag!=="TEXTAREA"){ e.preventDefault(); if(S.ro)return;
      if(e.shiftKey||e.key==="y"||e.key==="Y")doRedo(); else doUndo(); return; }
  }
  if(t&&t.dataset&&t.dataset.a==="memo"&&e.key==="Enter"){
    const m=byId(S.members,t.dataset.v); if(!m)return;
    if(!S.ro)pushUndo((t.dataset.kind==="build"?"빌드업":"몸상태")+" 메모 · "+m.name);
    if(addMemo(m,t.value,t.dataset.kind,t.dataset.teacher||null,t.dataset.day||null)){ logAct((t.dataset.kind==="build"?"빌드업":"몸상태")+" 메모",m.name); t.value=""; save(); render(); toast("메모를 남겼어요."); }
    return;
  }
  if(t&&t.dataset&&t.dataset.a==="nameedit"){
    const m=byId(S.members,t.dataset.v); if(!m)return;
    if(e.key==="Enter"){
      const v=t.value.trim();
      if(v){
        if(v!==m.name){
          m.aliasNames=Array.isArray(m.aliasNames)?m.aliasNames:[];
          if(m.aliasNames.indexOf(m.name)<0)m.aliasNames.push(m.name);
        }
        logAct("이름 수정",m.name+" → "+v); m.name=v; S.editMemo=null; save(); render(); toast("이름을 고쳤어요.");
      }
      return;
    }
    if(e.key==="Escape"){ S.editMemo=null; render(); return; }
  }
  if(t&&t.dataset&&t.dataset.a==="memoedit"){
    const m=byId(S.members,t.dataset.v); if(!m)return;
    if(e.key==="Enter"){
      const v=t.value.trim();
      e.preventDefault(); saveMemoEdit(m,+t.dataset.i,t.value);
      return;
    }
    if(e.key==="Escape"){ S.editMemo=null; render(); return; }
  }
  if(DV.full){
    if(e.key==="Escape"){ DV.full=false; paintDocFull(); return; }
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ docMove(e.key==="ArrowLeft"?-1:1); e.preventDefault(); return; }
  }
  if(S.openId&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){
    const tg=(e.target&&e.target.tagName)||"";
    if(tg!=="INPUT"&&tg!=="TEXTAREA"&&tg!=="SELECT"){ docMove(e.key==="ArrowLeft"?-1:1); e.preventDefault(); return; }
  }
  if(e.key==="Escape"&&S.openId&&docNarrow()&&$("docpane").classList.contains("on")){ docAction("docback"); return; }
  if(e.key==="Escape"){ closePop(); closeDrawer(); }
});

  /* 먼저 복사해 둔다. input.value를 비우면 files 목록도 같이 비워진다 */
  const picked=Array.from(e.target.files||[]);
  e.target.value="";
  if(!picked.length){ toast("고른 파일이 없어요."); return; }
  takeFiles(picked);
});
$("scrim").addEventListener("click",closeDrawer);
$("pop").addEventListener("click",e=>{ if(e.target.id==="pop")closePop(); });
(function(){
  let depth=0;
  const has=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).indexOf("Files")>=0;
  const show=on=>$("drop").classList.toggle("on",on);
  window.addEventListener("dragenter",e=>{ if(!has(e)||S.ro||S.openId)return; e.preventDefault(); depth++; show(true); });
  window.addEventListener("dragover",e=>{ if(!has(e)||S.ro)return; e.preventDefault(); });
  window.addEventListener("dragleave",e=>{ if(!has(e))return; depth=Math.max(0,depth-1); if(!depth)show(false); });
  window.addEventListener("drop",e=>{ if(!has(e))return; e.preventDefault(); depth=0; show(false);
    if(S.openId){ if(!S.ro)docAddFiles(e.dataTransfer.files); return; }
    if(!S.ro)takeFiles(Array.from(e.dataTransfer.files||[])); });
})();


/* ===================== 회원 자료 (검사결과지·체험상담지) =====================
   사진은 무거워서 기존 저장소(localStorage)와 따로 둔다.
   · 창고: 브라우저 대용량 저장소(IndexedDB) — 보기용, 빠름
   · 보관 폴더: 회사컴의 진짜 폴더 — 원본 사본. 창고가 비워져도 여기서 되살린다
   나중에 서버로 옮길 때는 이 칸의 docStore* 함수만 바꾸면 된다. */
const DOC_KINDS=["검사결과지","체험상담지"];
const DOC_MAX_EDGE=2400, DOC_Q=0.85;
const DOCS={db:null,list:[],dir:null,ready:false,failed:false};
const DV={mid:null,id:null,page:0,add:false,full:false};           /* 지금 보고 있는 자료 */
const DP={pages:[],kind:DOC_KINDS[0],date:null};                    /* 넣기 전 대기 */
const DURL=new Map();                                               /* 사진 미리보기 주소 */

function docStoreOpen(){
  return new Promise((ok,no)=>{
    let r; try{ r=indexedDB.open("reldesk-docs",1); }catch(e){ no(e); return; }
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("docs"))d.createObjectStore("docs",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta"); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);
  });
}
const docReq=q=>new Promise((ok,no)=>{ q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error); });
const docOS=(s,mode)=>DOCS.db.transaction(s,mode||"readonly").objectStore(s);
const docStoreAll=()=>docReq(docOS("docs").getAll());
const docStorePut=v=>docReq(docOS("docs","readwrite").put(v));
const docStoreDel=id=>docReq(docOS("docs","readwrite").delete(id));
const docMetaGet=k=>docReq(docOS("meta").get(k));
const docMetaPut=(k,v)=>docReq(docOS("meta","readwrite").put(v,k));

async function docsInit(){
  try{
    DOCS.db=await docStoreOpen();
    DOCS.list=await docStoreAll();
    if(typeof window.showDirectoryPicker==="function"){ try{ DOCS.dir=(await docMetaGet("dir"))||null; }catch(e){} }
  }catch(e){ DOCS.failed=true; }
  DOCS.ready=true;
  render();
}
const docOwners=m=>{ const s=new Set([m.id]); (S.trials||[]).forEach(t=>{ if(t.memberId===m.id)s.add(t.id); }); return s; };
/* 순서: 손으로 정한 순서(m.docOrder)가 있으면 그 첫 번째를 맨 앞에 두고,
   새로 들어온 자료(순서에 없는 것)는 날짜순으로 그 바로 뒤, 나머지 정한 순서가 그다음 */
const docsOf=m=>{ const o=docOwners(m);
  const base=DOCS.list.filter(d=>o.has(d.memberId))
    .sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.savedAt<a.savedAt?-1:1));
  const ord=m.docOrder||[]; if(!ord.length)return base;
  const inOrd=ord.map(id=>base.find(d=>d.id===id)).filter(Boolean), rest=base.filter(d=>ord.indexOf(d.id)<0);
  return inOrd.length?[inOrd[0]].concat(rest,inOrd.slice(1)):base; };
function docReorder(m,id,to){
  const ids=docsOf(m).map(d=>d.id), from=ids.indexOf(id); if(from<0||to<0||from===to)return;
  pushUndo("자료 순서 · "+m.name); ids.splice(from,1); ids.splice(to,0,id);
  m.docOrder=ids; DV.id=id; DV.page=0; save(); render();
  if(to===0)toast("맨 앞으로 옮겼어요. 상세를 열면 이 자료가 먼저 떠요.");
}
const docCount=m=>DOCS.ready?docsOf(m).length:0;
function docURL(d,p){
  const k=d.id+":"+p; if(!DURL.has(k))DURL.set(k,URL.createObjectURL(d.pages[p].blob));
  return DURL.get(k);
}
function docURLclear(){ DURL.forEach(u=>URL.revokeObjectURL(u)); DURL.clear(); DP.pages.forEach(p=>URL.revokeObjectURL(p.url)); }

/* ── 사진 줄이기 — 결과지 글씨가 읽히도록 긴 변 2400px ── */
function docShrink(file){
  return new Promise((ok,no)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,DOC_MAX_EDGE/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(u); b?ok({blob:b,w,h}):no(new Error("변환 실패")); },"image/jpeg",DOC_Q);
    };
    im.onerror=()=>{ URL.revokeObjectURL(u); no(new Error("사진을 읽지 못했어요")); };
    im.src=u;
  });
}
async function docAddFiles(files){
  const isPdf=f=>f&&(f.type==="application/pdf"||/\.pdf$/i.test(f.name||""));
  files=Array.from(files||[]).filter(f=>f&&((f.type&&f.type.indexOf("image/")===0)||isPdf(f)));
  if(!files.length){ toast("사진이나 PDF 파일만 넣을 수 있어요."); return; }
  for(const f of files){
    try{
      if(isPdf(f)){ const b=new Blob([await f.arrayBuffer()],{type:"application/pdf"});
        DP.pages.push({blob:b,pdf:true,name:f.name||"PDF",url:URL.createObjectURL(b)}); continue; }
      const r=await docShrink(f); r.url=URL.createObjectURL(r.blob); DP.pages.push(r); }
    catch(e){ toast(e.message||"파일을 읽지 못했어요"); }
  }
  DV.add=true; paintDocs();
}

/* 날짜·종류 고치기 — 창고 기록을 고치고, 보관 폴더의 파일 이름도 새로 맞춘다 */
async function docRedate(id,date,kind){
  const d=DOCS.list.find(x=>x.id===id); if(!d)return;
  if(DOCS.list.some(x=>x.id!==id&&x.memberId===d.memberId&&x.date===date&&x.kind===kind)){
    toast("같은 날짜·종류 자료가 이미 있어요."); paintDocs(); return; }
  const old={date:d.date,kind:d.kind}, oldNames=docFileNames(d), oldF=d.fname;
  d.date=date; d.kind=kind;
  if(d.pdf){ const mm=byId(S.members,d.memberId)||{id:d.memberId}; d.fname=docPdfName(mm,d); }
  try{ await docStorePut(d); }catch(e){ Object.assign(d,old); d.fname=oldF; toast("고치지 못했어요."); paintDocs(); return; }
  DOCS.list.sort((a,b)=>b.date.localeCompare(a.date)||b.savedAt.localeCompare(a.savedAt));
  logAct("자료 고침",d.member+" · "+old.date+" "+old.kind+" → "+date+" "+kind);
  let msg="고쳤어요.";
  const m=byId(S.members,d.memberId);
  if(DOCS.dir&&m){
    try{
      if(await docPerm(true)!=="granted")throw 0;
      await docWriteFolder(m,d);
      const sub=await DOCS.dir.getDirectoryHandle(docFolderName(m));
      const nowNames=docFileNames(d);
      for(const nm of oldNames){ if(nowNames.indexOf(nm)<0){ try{ await sub.removeEntry(nm); }catch(e){} } }
      msg="고쳤어요. 보관 폴더 파일 이름도 바꿨어요.";
    }catch(e){ msg="고쳤어요. 보관 폴더 파일 이름은 못 바꿨어요."; }
  }
  save(); render(); toast(msg);
}
/* ── 보관 폴더 ── */
const docSafe=s=>String(s).replace(/[\\/:*?"<>|]/g,"_").trim();
const phone4=m=>String(m.phone||"").replace(/\D/g,"").slice(-4);
const docFolderName=m=>docSafe(m.name+(phone4(m)?"_"+phone4(m):""));
async function docPerm(ask){
  if(!DOCS.dir)return "none";
  const o={mode:"readwrite"};
  let s=await DOCS.dir.queryPermission(o);
  if(s!=="granted"&&ask)s=await DOCS.dir.requestPermission(o);   /* 누른 순간이라야 허용 창이 뜬다 */
  return s;
}
/* 폴더 파일 이름: 사진은 '날짜_종류_N쪽.jpg', PDF는 '날짜_종류.pdf' (같은 날 같은 종류 PDF가 또 있으면 _2, _3) */
function docPdfName(m,rec){
  const own=docOwners(m), used=new Set(DOCS.list.filter(d=>d.pdf&&d.id!==rec.id&&own.has(d.memberId)).map(d=>d.fname));
  let n=1, nm; do{ nm=docSafe(rec.date+"_"+rec.kind+(n>1?"_"+n:"")+".pdf"); n++; }while(used.has(nm)); return nm;
}
const docFileNames=rec=>rec.pdf?[rec.fname||docSafe(rec.date+"_"+rec.kind+".pdf")]:rec.pages.map((p,i)=>docSafe(rec.date+"_"+rec.kind+"_"+(i+1)+"쪽.jpg"));
async function docWriteFolder(m,rec){
  const sub=await DOCS.dir.getDirectoryHandle(docFolderName(m),{create:true});
  const names=docFileNames(rec);
  for(let i=0;i<rec.pages.length;i++){
    const fh=await sub.getFileHandle(names[i],{create:true});
    const w=await fh.createWritable(); await w.write(rec.pages[i].blob); await w.close();
  }
  return sub.name;
}
async function docPickDir(){
  if(typeof window.showDirectoryPicker!=="function"){ toast("이 브라우저는 폴더 연결이 안 돼요. 크롬으로 열어주세요."); return; }
  try{
    DOCS.dir=await window.showDirectoryPicker({id:"reldesk-docs",mode:"readwrite"});
    await docMetaPut("dir",DOCS.dir);
    logAct("보관 폴더 연결",DOCS.dir.name); save(); render(); toast("보관 폴더를 연결했어요: "+DOCS.dir.name);
  }catch(e){ if(e.name!=="AbortError")toast("폴더를 연결하지 못했어요."); }
}
/* 폴더 → 창고. 회원은 '이름_끝4자리' 폴더로 찾고, 이미 있는 건 건너뛴다 */
async function docRestoreFromDir(){
  if(!DOCS.dir){ toast("먼저 보관 폴더를 연결하세요."); return; }
  if(await docPerm(true)!=="granted"){ toast("폴더 읽기를 허용해야 되살릴 수 있어요."); return; }
  const ownerOf=id=>{ const t=(S.trials||[]).find(x=>x.id===id); return t&&t.memberId?t.memberId:id; };
  const have=new Set(DOCS.list.map(d=>ownerOf(d.memberId)+"|"+d.date+"|"+d.kind));
  let n=0,files=0; const miss=[];
  for await (const [name,h] of DOCS.dir.entries()){
    if(h.kind!=="directory")continue;
    const mm=name.match(/^(.*?)(?:_(\d{4}))?$/), nm=mm[1], p4=mm[2]||"";
    let cands=S.members.filter(x=>x.name===nm);
    if(p4&&cands.length>1)cands=cands.filter(x=>phone4(x)===p4);
    if(!cands.length){ cands=(S.trials||[]).filter(x=>x.name===nm&&!x.memberId); if(p4&&cands.length>1)cands=cands.filter(x=>phone4(x)===p4); }
    if(cands.length!==1){ miss.push(name); continue; }
    const m=cands[0], groups={}, pdfs=[];
    for await (const [fn,fh] of h.entries()){
      if(fh.kind!=="file")continue;
      const pm=fn.match(/^(\d{4}-\d{2}-\d{2})_(.+?)(?:_(\d+))?\.pdf$/i); if(pm){ pdfs.push({fn,date:pm[1],kind:pm[2],fh}); continue; }
      const x=fn.match(/^(\d{4}-\d{2}-\d{2})_(.+?)_(\d+)쪽\.jpe?g$/i); if(!x)continue;
      (groups[x[1]+"|"+x[2]]=groups[x[1]+"|"+x[2]]||[]).push({i:+x[3],fh});
    }
    for(const k in groups){
      const [date,kind]=k.split("|");
      if(have.has(m.id+"|"+date+"|"+kind))continue;
      const pages=[];
      for(const pg of groups[k].sort((a,b)=>a.i-b.i)){
        const f=await pg.fh.getFile();
        pages.push({blob:new Blob([await f.arrayBuffer()],{type:"image/jpeg"}),w:0,h:0}); files++;
      }
      const rec={id:uid("d"),memberId:m.id,member:m.name,date,kind,savedAt:new Date().toISOString(),pages};
      await docStorePut(rec); DOCS.list.push(rec); have.add(m.id+"|"+date+"|"+kind); n++;
    }
    const haveF=new Set(DOCS.list.filter(d=>d.pdf&&ownerOf(d.memberId)===m.id).map(d=>d.fname));
    for(const p of pdfs){
      if(haveF.has(p.fn))continue;
      const f=await p.fh.getFile(); files++;
      const rec={id:uid("d"),memberId:m.id,member:m.name,date:p.date,kind:p.kind,savedAt:new Date().toISOString(),pdf:true,fname:p.fn,
        pages:[{blob:new Blob([await f.arrayBuffer()],{type:"application/pdf"}),pdf:true}]};
      await docStorePut(rec); DOCS.list.push(rec); haveF.add(p.fn); n++;
    }
  }
  logAct("폴더에서 자료 되살림",n+"묶음 · "+files+"장"+(miss.length?" · 못 찾은 폴더 "+miss.length:""));
  save(); render();
  toast(n?n+"묶음("+files+"장)을 되살렸어요."+(miss.length?" 회원을 못 찾은 폴더: "+miss.slice(0,3).join(", ")+(miss.length>3?" 외":""):""):
    (miss.length?"회원을 못 찾은 폴더만 있어요: "+miss.slice(0,3).join(", "):"되살릴 새 자료가 없어요."));
}

/* ── 저장·지우기 ── */
async function docSave(m){
  if(!DP.pages.length)return;
  if(!DOCS.db){ toast("이 브라우저에서는 자료를 저장할 수 없어요."); return; }
  let folderOk=false;
  if(DOCS.dir){ try{ folderOk=(await docPerm(true))==="granted"; }catch(e){} }
  const base={memberId:m.id,member:m.name,date:DP.date||TODAY(),kind:DP.kind,
    savedAt:new Date().toISOString(),by:S.me?(byId(S.staff,S.me)||{}).name:""};
  const imgs=DP.pages.filter(p=>!p.pdf), pdfs=DP.pages.filter(p=>p.pdf), recs=[];
  if(imgs.length)recs.push(Object.assign({id:uid("d")},base,{pages:imgs.map(p=>({blob:p.blob,w:p.w,h:p.h}))}));
  pdfs.forEach(p=>recs.push(Object.assign({id:uid("d")},base,{pdf:true,pages:[{blob:p.blob,pdf:true}]})));
  let where="";
  for(const rec of recs){
    if(rec.pdf)rec.fname=docPdfName(m,rec);
    try{ await docStorePut(rec); }catch(e){ toast("저장하지 못했어요: "+e.message); return; }
    DOCS.list.push(rec);
    if(folderOk){ try{ where=" · 폴더 "+(await docWriteFolder(m,rec)); }catch(e){ where=" · 폴더 사본 실패"; } }
  }
  DP.pages.forEach(p=>URL.revokeObjectURL(p.url)); DP.pages=[]; DV.add=false; DV.pane=true;
  DV.id=recs[0].id; DV.page=0;
  recs.forEach(rec=>logAct("자료 추가",m.name+" · "+rec.date+" · "+rec.kind+" · "+(rec.pdf?"PDF":rec.pages.length+"쪽")+where));
  save(); render();
  toast(!DOCS.dir?"저장했어요. 설정 → 데이터에서 보관 폴더를 연결하면 원본 사본도 남아요.":
        (folderOk?"저장했어요. 보관 폴더에도 사본을 남겼어요.":"저장했어요. 폴더를 허용하지 않아 사본은 못 남겼어요."));
}
async function docDelete(id){
  const d=DOCS.list.find(x=>x.id===id); if(!d)return;
  if(!confirm(d.date+" "+d.kind+"("+d.pages.length+"쪽)를 지울까요?\n보관 폴더의 사본은 남습니다."))return;
  try{ await docStoreDel(id); }catch(e){ toast("지우지 못했어요."); return; }
  DOCS.list=DOCS.list.filter(x=>x.id!==id);
  for(let p=0;p<d.pages.length;p++){ const k=id+":"+p; if(DURL.has(k)){ URL.revokeObjectURL(DURL.get(k)); DURL.delete(k); } }
  if(DV.id===id){ DV.id=null; DV.page=0; }
  logAct("자료 지움",d.member+" · "+d.date+" · "+d.kind); save(); render(); toast("지웠어요. 보관 폴더 사본은 그대로예요.");
}

/* ── 화면 ── */
function docCurrent(m){
  const list=docsOf(m); if(!list.length)return null;
  let d=list.find(x=>x.id===DV.id)||list[0];
  if(DV.id!==d.id){ DV.id=d.id; DV.page=0; }
  if(DV.page>=d.pages.length)DV.page=d.pages.length-1;
  return d;
}
function paintDocs(){
  const pane=$("docpane"); if(!pane)return;
  const m=S.openId?byId(S.members,S.openId):null;
  if(m&&DV.mid!==m.id){ DV.mid=m.id; DV.id=null; DV.page=0; DV.add=false; DV.pane=false; }
  /* 자료가 없는 회원은 자료 칸을 띄우지 않는다. 추가 중일 때만 연다 */
  /* 좁은 화면(폰)에서는 상세를 덮으므로 '자료 보기'나 '자료 추가'를 눌렀을 때만 연다 */
  const show=!!m&&(DV.add||(DOCS.ready&&!DOCS.failed&&docCount(m)>0&&(!docNarrow()||DV.pane)));
  pane.classList.toggle("on",show);
  $("drawer").classList.toggle("withdoc",show);
  if(!show){ pane.innerHTML=""; return; }
  if(!DOCS.ready){ pane.innerHTML='<div class="dpempty">자료를 불러오는 중…</div>'; return; }
  if(DOCS.failed){ pane.innerHTML='<div class="dpempty">이 브라우저에서는 자료 칸을 쓸 수 없어요. 크롬으로 열어주세요.</div>'; return; }
  const list=docsOf(m), d=docCurrent(m);
  let h='<div class="dph"><button class="btn sm gh dnarrow" data-a="docback">← 상세</button><b>자료</b><span>'+esc(m.name)+(list.length?' · '+list.length+'건':'')+'</span><span class="sp"></span>'+
    (S.ro?'':'<button class="btn sm'+(DV.add?' navy':'')+'" data-a="docadd">+ 자료 추가</button>')+'</div>';
  if(DV.add&&!S.ro){
    const dt=DP.date||TODAY();
    h+='<div class="dpadd">'+
      '<div class="row2">'+DOC_KINDS.map(k=>'<button class="btn sm'+(DP.kind===k?' navy':'')+'" data-a="dockind" data-v="'+k+'">'+k+'</button>').join("")+
        '<span class="sp"></span><span style="font-size:12px;color:var(--mut2)">검사한 날</span>'+
        '<input type="date" class="dpdate" data-a="docdate" value="'+esc(dt)+'" max="'+esc(TODAY())+'"></div>'+
      '<div class="dpdrop" data-a="docpick">'+(docNarrow()?'눌러서 <b>사진 찍기</b> 또는 앨범에서 고르기':'사진·PDF를 여기로 끌어다 놓기 · 눌러서 고르기 · <b>Ctrl+V</b> 붙여넣기')+
        '<small>사진 여러 장은 1쪽·2쪽… 한 묶음이 되고, PDF는 받은 그대로 한 건으로 저장됩니다</small></div>'+
      (DP.pages.length?'<div class="dppend">'+DP.pages.map((p,i)=>p.pdf?'<span class="dppdf" title="'+esc(p.name)+'">PDF<i>'+esc(p.name)+'</i></span>':'<img src="'+p.url+'" title="'+(i+1)+'쪽">').join("")+'</div>':'')+

/* 버튼 처리 — 기존 클릭 처리기에서 먼저 넘겨받는다. 처리했으면 true */
function docAction(a,v,t){
  const m=S.openId?byId(S.members,S.openId):null;
  if(a==="docdir"){ docPickDir(); return true; }
  if(a==="docrestore"){ docRestoreFromDir(); return true; }
  if(!m)return false;
  if(a==="docsel"){ DV.id=v; DV.page=0; paintDocs(); return true; }
  if(a==="docpg"){ docMove(+v); return true; }
  if(a==="docbig"){ DV.full=true; paintDocFull(); return true; }
  if(a==="docopen"){ DV.pane=true; paintDocs(); return true; }
  if(a==="docback"){ DV.pane=false; DV.add=false; DP.pages.forEach(p=>URL.revokeObjectURL(p.url)); DP.pages=[]; paintDocs(); return true; }
  if(a==="docfullx"){ DV.full=false; paintDocFull(); return true; }
  if(S.ro)return false;
  if(a==="docadd"){ DV.add=!DV.add; if(DV.add&&!DP.date)DP.date=TODAY(); paintDocs(); return true; }
  if(a==="dockind"){ DP.kind=v; paintDocs(); return true; }
  if(a==="docpick"){ $("docFile").click(); return true; }
  if(a==="docclear"){ DP.pages.forEach(p=>URL.revokeObjectURL(p.url)); DP.pages=[]; if(!t||t.textContent.indexOf("닫기")>=0)DV.add=false; paintDocs(); return true; }
  if(a==="docsave"){ docSave(m); return true; }
  if(a==="docdel"){ docDelete(v); return true; }
  if(a==="docfirst"){ docReorder(m,v,0); return true; }
  if(a==="docrekind"){ const d=DOCS.list.find(x=>x.id===v); if(d)docRedate(v,d.date,DOC_KINDS[(DOC_KINDS.indexOf(d.kind)+1)%DOC_KINDS.length]); return true; }
  return false;
}

/* 생년월일: 19650312 · 650312 · 1965.3.12 · 1965-03-12 모두 받는다 */
function parseBirth(v){
  if(v instanceof Date&&!isNaN(v))return D(v);
  if(typeof v==="number"&&v>1000&&v<80000)return D(new Date(Math.round((v-25569)*86400000)+new Date().getTimezoneOffset()*60000));
  v=String(v||"").trim(); if(!v)return "";
  /* 주민등록번호가 들어오면 앞 6자리와 성별 자리로 생년월일만 만들고 나머지는 버린다 */
  const rn=v.replace(/\s/g,"").match(/^(\d{6})-?([0-9])\d{6}$/);
  if(rn){ const c={1:"19",2:"19",5:"19",6:"19",3:"20",4:"20",7:"20",8:"20",9:"18",0:"18"}[rn[2]];
    v=c+rn[1]; }
  let y,m,d; const n=v.match(/\d+/g)||[];
  if(n.length>=3){ [y,m,d]=n; }
  else{ const g=digits(v);
    if(g.length===8){ y=g.slice(0,4); m=g.slice(4,6); d=g.slice(6); }
    else if(g.length===6){ y=g.slice(0,2); m=g.slice(2,4); d=g.slice(4); }
    else return null; }
  y=+y; m=+m; d=+d;
  if(y<100){ const cy=new Date().getFullYear()%100; y+=(y>cy?1900:2000); }
  const dt=new Date(y,m-1,d);
  if(!(y>1900&&dt.getMonth()===m-1&&dt.getDate()===d&&dt<=new Date()))return null;
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function ageOf(b){ if(!b)return ""; const [y,m,d]=b.split("-").map(Number), t=new Date();
  let a=t.getFullYear()-y; if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<d))a--; return "만 "+a+"세"; }

/* ── 서명 판 ── */
function trialPadInit(){
  const c=$("tpad"); if(!c||!TD)return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const g=c.getContext("2d"); g.scale(dpr,dpr);
  const W=r.width,H=r.height;
  const style=()=>{ g.lineWidth=2.4; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#111"; };
  const draw=()=>{ g.clearRect(0,0,W,H); style();
    TD.sig.forEach(s=>{ g.beginPath(); s.forEach(([x,y],i)=>i?g.lineTo(x*W,y*H):g.moveTo(x*W,y*H)); if(s.length===1)g.lineTo(s[0][0]*W+.5,s[0][1]*H); g.stroke(); }); };
  draw();
  let cur=null;
  const pt=e=>{ const b=c.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))]; };
  c.onpointerdown=e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); cur=[pt(e)]; TD.sig.push(cur); draw(); };
  c.onpointermove=e=>{ if(!cur)return; cur.push(pt(e)); const n=cur.length; style(); g.beginPath();
    g.moveTo(cur[n-2][0]*W,cur[n-2][1]*H); g.lineTo(cur[n-1][0]*W,cur[n-1][1]*H); g.stroke(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
}
/* 상담 내용 + 동의 문구 + 이름·날짜 + 서명을 한 장으로 — 회원이 확인한 그대로 남긴다 */
function trialSignImage(t){
  return new Promise((ok,no)=>{
    const W=1200, P=70, CW=W-P*2, font='"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    const c=document.createElement("canvas"), g=c.getContext("2d");
    const wrap=(text,px,maxW,weight)=>{ g.font=(weight||"")+" "+px+"px "+font; const out=[];
      String(text).split("\n").forEach(par=>{ let line="";
        for(const ch of par){ if(g.measureText(line+ch).width>maxW&&line){ out.push(line); line=ch.trim()?ch:""; } else line+=ch; }
        out.push(line); });
      return out; };
    /* 먼저 줄을 다 계산해서 높이를 잡는다 */
    const qa=trialLines(t).map(([k,v])=>[k,wrap(v,28,CW-150)]);
    const terms=wrap(TRIAL_TERMS,28,CW-40);
    const info=[["성함",t.name],["생년월일",t.birth||"-"],["연락처",fmtPhone(t.phone)||"-"],["체험일",t.date],["담당",staffName({staffId:t.staffId})||"-"],
      ["서명 일시",new Date().toLocaleString("ko-KR",{hour12:false})]];
    const LH=44, sigH=320;
    const qaH=qa.length?qa.reduce((a,[,l])=>a+l.length*LH+14,0):LH;
    const H=P+80+ info.length*46+30 + 50+qaH+30 + terms.length*LH+40+60 + 30+sigH+P;
    c.width=W; c.height=H;
    g.fillStyle="#fff"; g.fillRect(0,0,W,H); g.textBaseline="top";
    let y=P;
    g.fillStyle="#111"; g.font="700 42px "+font; g.fillText("릴렉싱 프로그램 체험 상담 · 동의서",P,y); y+=80;
    info.forEach(([k,v])=>{ g.font="600 26px "+font; g.fillStyle="#777"; g.fillText(k,P,y);
      g.font="28px "+font; g.fillStyle="#111"; g.fillText(String(v),P+160,y); y+=46; });
    y+=30;
    g.fillStyle="#111"; g.font="700 30px "+font; g.fillText("상담 내용",P,y); y+=50;
    g.strokeStyle="#ddd"; g.lineWidth=2; g.beginPath(); g.moveTo(P,y-10); g.lineTo(W-P,y-10); g.stroke();
    if(!qa.length){ g.font="28px "+font; g.fillStyle="#999"; g.fillText("(적은 내용 없음)",P,y); y+=LH; }
    qa.forEach(([k,lines])=>{
      g.font="700 28px "+font; g.fillStyle="#555"; g.fillText(k,P,y);
      g.font="28px "+font; g.fillStyle="#111"; lines.forEach(l=>{ g.fillText(l,P+150,y); y+=LH; }); y+=14; });
    y+=30;
    g.fillStyle="#f4f5f7"; g.fillRect(P,y-16,CW,terms.length*LH+32+60);
    g.fillStyle="#111"; g.font="28px "+font; terms.forEach(l=>{ g.fillText(l,P+20,y); y+=LH; });
    g.font="700 28px "+font; g.fillText("위 상담 내용을 확인하였으며, 동의합니다.",P+20,y+10); y+=60+40;
    y+=30-40+40;
    g.strokeStyle="#bbb"; g.lineWidth=2; g.strokeRect(P,y,CW,sigH);
    g.font="24px "+font; g.fillStyle="#999"; g.fillText("서명",P+14,y+12);
    const bw=CW-40, bh=sigH-40, bx=P+20, by=y+20;
    g.strokeStyle="#111"; g.lineWidth=4; g.lineCap="round"; g.lineJoin="round";
    TD.sig.forEach(s=>{ g.beginPath(); s.forEach(([x,yy],i)=>i?g.lineTo(bx+x*bw,by+yy*bh):g.moveTo(bx+x*bw,by+yy*bh)); if(s.length===1)g.lineTo(bx+s[0][0]*bw+1,by+s[0][1]*bh); g.stroke(); });
    c.toBlob(b=>b?ok({blob:b,w:W,h:H}):no(new Error("동의서 그림을 만들지 못했어요")),"image/jpeg",0.9);
  });
}

/* ===================== 재등록 가능성 ===================== */
/* 우리 센터의 끝난 수강권들로 '비슷한 조건에서 몇 %가 재등록했나'를 세고,
   그 차이를 점수로 바꿔 더한다. 엑셀을 올릴 때마다 표가 새로 계산된다.
   - 재등록 = 그 수강권보다 뒤에 시작한 수강권이 하나라도 있으면 (누구에게, 무엇을 끊었든)
   - 끝났는데 60일이 안 지났고 아직 새 수강권이 없으면 결론이 안 난 것이라 뺀다 */
const RP_WAIT=60;
const RP_F=[
  {k:"hist",label:"재등록 이력",f:x=>x.prior>=1?"있음":"처음"},
  {k:"size",label:"수강권 크기",f:x=>!x.total?null:x.total<=21?"20회 이하":x.total<=35?"30회대":"50회 이상"},
  {k:"left",label:"끝날 때 남는 회차",f:x=>x.left==null?null:x.left<=0?"다 씀":x.left<=5?"1~5회 남김":"6회+ 남김"},
  {k:"age",label:"나이",f:x=>x.age==null?null:x.age<40?"40세 미만":x.age<60?"40~59세":"60세 이상"}
];
const RP_ORDER={hist:["있음","처음"],size:["50회 이상","30회대","20회 이하"],left:["다 씀","1~5회 남김","6회+ 남김"],age:["40~59세","60세 이상","40세 미만"]};
let RP={f:"soon",sort:"end",g:"main"};
/* 잠수 — 이만큼 넘게 안 나오고 앞으로 예약도 없으면 사실상 이탈로 보고 예측에서 뺀다 */
const DIVE_DAYS=60;
const rpBirthYear=m=>{ const y=m.birth?+String(m.birth).slice(0,4):0; return y>1900?y:null; };
const rpSorted=m=>(m.passes||[]).filter(p=>p.start).slice().sort((a,b)=>String(a.start).localeCompare(String(b.start)));
/* 과거 표본: 끝난 수강권 하나하나 */
function rpSamples(){
  return cache("rp","samples",()=>{
    const out=[], today=TODAY();
    S.members.forEach(m=>{
      const ps=rpSorted(m), by=rpBirthYear(m), lv=lastVisit(m);
      ps.forEach((p,i)=>{
        const rem=+p.remaining||0, ended=rem<=0||(p.expiry&&p.expiry<today);
        if(!ended)return;
        const renewed=ps.some((q,j)=>j>i&&String(q.start)>String(p.start));
        let end=rem<=0?(p.zeroAt||(lv?D(lv):null)||p.expiry):p.expiry;
        if(end&&p.expiry&&end>p.expiry)end=p.expiry;
        const ed=parseD(end);
        if(!renewed&&(!ed||daysBetween(new Date(),ed)<RP_WAIT))return;
        const sy=+String(p.start).slice(0,4);
        out.push({m,p,renewed,prior:i,total:+p.total||0,left:rem,age:by&&sy?sy-by:null});
      });
    });
    return out;
  });
}
/* 표 만들기 (라플라스 1 — 표본이 적은 칸이 튀지 않게) */
function rpFit(data){
  const y=data.filter(s=>s.renewed).length, n=data.length;
  const base=Math.log((y+1)/(n-y+1)), tab={}, cnt={};
  RP_F.forEach(F=>{
    const c={};
    data.forEach(s=>{ const v=F.f(s); if(v==null)return; (c[v]=c[v]||[0,0])[s.renewed?0:1]++; });
    tab[F.k]={}; cnt[F.k]=c;
    Object.keys(c).forEach(v=>{ const [a,b]=c[v]; tab[F.k][v]=Math.log((a+1)/(y+2))-Math.log((b+1)/(n-y+2)); });
  });
  return {base,tab,cnt,n,y};
}
const rpPts=z=>Math.round(z*10);
const rpProb=pts=>1/(1+Math.exp(-pts/10));
function rpScore(M,x){
  let pts=rpPts(M.base); const parts=[];
  RP_F.forEach(F=>{ const v=F.f(x); if(v==null||!(v in M.tab[F.k]))return;
    const q=rpPts(M.tab[F.k][v]); pts+=q; parts.push({k:F.k,label:F.label,v,q}); });
  return {pts,p:rpProb(pts),parts};
}
function rpModel(){ return cache("rp","model",()=>{ const d=rpSamples(); return d.length>=20?rpFit(d):null; }); }
/* 맞춰보기: 한 건씩 빼고 나머지로 만든 표로 그 건을 맞힌다 */
function rpBacktest(){
  return cache("rp","bt",()=>{
    const d=rpSamples(); if(d.length<20)return null;
    const b={hi:[0,0],mid:[0,0],lo:[0,0]};
    d.forEach((s,i)=>{ const M=rpFit(d.slice(0,i).concat(d.slice(i+1))), p=rpScore(M,s).p;
      const k=p>=.8?"hi":p>=.55?"mid":"lo"; b[k][0]+=s.renewed?1:0; b[k][1]++; });
    return b;
  });
}
/* 지금 회원: 살아 있는 수강권 기준, 끝날 때 남을 회차는 지금까지의 속도로 예상 */
function rpNow(m){
  const lp=livePasses(m); if(!lp.length)return null;
  if(lp.length>=2)return {already:true};
  const p=lp[0], ps=rpSorted(m), i=Math.max(0,ps.indexOf(p));
  const rem=+p.remaining||0, used=(+p.total||0)-rem, st=parseD(p.start), ex=parseD(p.expiry);
  let perDay=null;
  if(st){ const dd=daysBetween(new Date(),st); if(dd>=14)perDay=Math.max(0,used)/dd; }   /* 2주 넘게 한 번도 안 썼으면 속도 0 */
  if(perDay==null){ const w=usePerWeek(m); if(w>0)perDay=w/7; }
  let left=null;

  window.AUTH={sb:null,user:null,staff:null};
  gate.classList.add("on");
  box.innerHTML='<h1>릴렉싱 데스크</h1><div class="s">불러오는 중…</div>';

  /* 로그인 화면 */
  function showLogin(msg){
    gate.classList.add("on");
    box.innerHTML='<h1>릴렉싱 데스크</h1><div class="s">강사 계정으로 로그인하세요</div>'+
      '<form id="agForm" autocomplete="on"><label>휴대폰 번호</label><input id="agPhone" inputmode="numeric" autocomplete="username" placeholder="01012345678">'+
      '<label>비밀번호</label><input id="agPw" type="password" autocomplete="current-password">'+
      '<button class="go" id="agGo" type="submit">로그인</button><div class="err" id="agErr">'+h(msg||"")+'</div></form>'+
      '<div class="hint">비밀번호를 잊었으면 파트장에게 임시 비밀번호를 받으세요.</div>';
    const ph=document.getElementById("agPhone"); ph.focus();
    document.getElementById("agForm").onsubmit=async e=>{
      e.preventDefault();
      const p=digits(ph.value), pw=document.getElementById("agPw").value, err=document.getElementById("agErr"), go=document.getElementById("agGo");
      if(p.length<10){ err.textContent="휴대폰 번호를 확인해주세요."; return; }
      if(!pw){ err.textContent="비밀번호를 넣어주세요."; return; }
      go.disabled=true; go.textContent="확인 중…"; err.textContent="";
      const {error}=await AUTH.sb.auth.signInWithPassword({email:p+ID_DOMAIN,password:pw});
      go.disabled=false; go.textContent="로그인";
      if(error){ err.textContent=/invalid/i.test(error.message)?"번호나 비밀번호가 맞지 않아요.":/banned|disabled/i.test(error.message)?"사용이 정지된 계정이에요.":"로그인하지 못했어요: "+error.message; return; }
      await afterLogin();
    };
  }
  /* 첫 로그인·임시 비밀번호면 새 비밀번호로 바꾸게 한다 */
  function showChangePw(force){
    gate.classList.add("on");
    box.innerHTML='<h1>새 비밀번호</h1><div class="s">'+(force?"임시 비밀번호로 들어왔어요. 본인만 아는 비밀번호로 바꿔주세요.":"비밀번호를 바꿉니다.")+'</div>'+
      '<form id="agForm"><label>새 비밀번호 (8자 이상)</label><input id="agPw1" type="password" autocomplete="new-password">'+
      '<label>한 번 더</label><input id="agPw2" type="password" autocomplete="new-password">'+
      '<button class="go" id="agGo" type="submit">바꾸기</button><div class="err" id="agErr"></div></form>'+
      (force?'':'<div class="hint"><a href="#" id="agCancel">취소</a></div>');
    document.getElementById("agPw1").focus();
    const c=document.getElementById("agCancel"); if(c)c.onclick=e=>{e.preventDefault(); gate.classList.remove("on");};
    document.getElementById("agForm").onsubmit=async e=>{
      e.preventDefault();
      const a=document.getElementById("agPw1").value, b=document.getElementById("agPw2").value, err=document.getElementById("agErr");
      if(a.length<8){ err.textContent="8자 이상으로 정해주세요."; return; }
      if(a!==b){ err.textContent="두 칸이 서로 달라요."; return; }
      const {error}=await AUTH.sb.auth.updateUser({password:a,data:{must_change:false}});
      if(error){ err.textContent="바꾸지 못했어요: "+error.message; return; }
      gate.classList.remove("on"); if(window.toast)toast("비밀번호를 바꿨어요.");
    };
  }
  async function afterLogin(){
    const {data:{user}}=await AUTH.sb.auth.getUser();
    if(!user){ showLogin(); return; }
    AUTH.user=user;
    const {data,error}=await AUTH.sb.from("staff").select("id,name,phone,is_admin,active").eq("auth_user",user.id).maybeSingle();
    if(error||!data){ await AUTH.sb.auth.signOut(); showLogin(error?"서버에 연결하지 못했어요: "+error.message:"강사 목록에 연결되지 않은 계정이에요. 파트장에게 문의하세요."); return; }
    if(!data.active){ await AUTH.sb.auth.signOut(); showLogin("사용이 정지된 계정이에요."); return; }
    AUTH.staff=data;
    paintChip();
    if(user.user_metadata&&user.user_metadata.must_change){ showChangePw(true); return; }
    gate.classList.remove("on");
  }
  /* 머리글: 이름 · 계정 관리 · 비밀번호 · 로그아웃 */
  function paintChip(){
    let c=document.getElementById("authChip");
    if(!c){ c=document.createElement("span"); c.id="authChip"; const r=document.querySelector(".hright"); if(r)r.insertBefore(c,r.firstChild); }
    c.innerHTML='<b>'+h(AUTH.staff.name)+'</b>'+
      (AUTH.staff.is_admin?'<button class="btn sm gh" id="acctBtn">계정 관리</button>':'')+
      '<button class="btn sm gh" id="pwBtn">비밀번호</button><button class="btn sm gh" id="outBtn">로그아웃</button>';
    c.classList.add("on");
    document.getElementById("outBtn").onclick=async()=>{ await AUTH.sb.auth.signOut(); AUTH.staff=null; c.classList.remove("on"); showLogin("로그아웃했어요."); };
    document.getElementById("pwBtn").onclick=()=>showChangePw(false);
    const a=document.getElementById("acctBtn"); if(a)a.onclick=openAccounts;
  }

  /* ── 계정 관리 (관리자만) — 실제 처리는 서버 함수 admin-users가 관리자 여부를 다시 확인하고 한다 ── */
  async function callAdmin(body){
    const {data,error}=await AUTH.sb.functions.invoke("admin-users",{body});
    if(error){ let m=error.message; try{ const j=await error.context.json(); if(j&&j.error)m=j.error; }catch(e){} throw new Error(m); }
    if(data&&data.error)throw new Error(data.error);
    return data;
  }
  const pop=()=>document.getElementById("pop");
  async function openAccounts(){
    pop().innerHTML='<div class="popbox" style="max-width:640px"><div class="poph"><div class="t">계정 관리</div><div class="s">불러오는 중…</div></div></div>';
    pop().classList.add("on");
    let list=[];
    try{ list=(await callAdmin({action:"list"})).staff||[]; }
    catch(e){ pop().innerHTML='<div class="popbox"><div class="poph"><div class="t">계정 관리</div><div class="s" style="color:var(--red)">'+h(e.message)+'</div></div>'+
      '<div style="padding:10px 20px 18px"><div class="note">서버 함수(admin-users)가 아직 없으면 이 메시지가 떠요. 안내에 따라 함수를 먼저 올려주세요.</div><button class="btn" style="margin-top:10px" data-a="closepop">닫기</button></div></div>'; return; }
    const me=AUTH.staff.phone;
    let t='<div class="popbox" style="max-width:640px"><div class="poph"><div class="t">계정 관리</div><div class="s">아이디는 휴대폰 번호예요. 임시 비밀번호로 처음 들어오면 본인이 새 비밀번호로 바꿉니다.</div></div>'+
      '<div class="acct" style="padding:6px 20px 18px"><table><thead><tr><th>이름</th><th>아이디(번호)</th><th>마지막 로그인</th><th></th></tr></thead><tbody>'+
      list.map(s=>'<tr class="'+(s.active?"":"off")+'"><td>'+h(s.name)+(s.is_admin?' <span class="tag n">관리자</span>':'')+(s.active?'':' <span class="tag r">정지</span>')+'</td>'+
        '<td>'+h(fmt(s.phone))+'</td><td>'+(s.last_sign_in_at?h(new Date(s.last_sign_in_at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})):'<span style="color:var(--fnt)">없음</span>')+'</td>'+
        '<td style="text-align:right;white-space:nowrap">'+(s.phone===me?'<span style="color:var(--fnt);font-size:12px">나</span>':
          '<button class="btn sm gh" data-acct="reset" data-p="'+h(s.phone)+'">임시 비번</button> '+
          (s.active?'<button class="btn sm gh" data-acct="disable" data-p="'+h(s.phone)+'">정지</button>':'<button class="btn sm gh" data-acct="enable" data-p="'+h(s.phone)+'">다시 쓰기</button>'))+'</td></tr>').join("")+
      '</tbody></table>'+
      '<form id="acctAdd"><input name="name" placeholder="이름 (예: 강다은)"><input name="phone" inputmode="numeric" placeholder="휴대폰 번호"><input name="pw" placeholder="임시 비밀번호 (8자+)"><button class="btn navy" type="submit">계정 추가</button></form>'+
      '<div class="err" id="acctErr" style="color:var(--red);font-size:12.5px;min-height:16px;margin-top:8px"></div>'+
      '<div style="text-align:right"><button class="btn" data-a="closepop">닫기</button></div></div></div>';
    pop().innerHTML=t;
    const err=document.getElementById("acctErr");
    document.getElementById("acctAdd").onsubmit=async e=>{
      e.preventDefault(); const f=e.target, name=f.name.value.trim(), phone=digits(f.phone.value), pw=f.pw.value;
      if(!name){ err.textContent="이름을 넣어주세요."; return; }
      if(phone.length<10){ err.textContent="휴대폰 번호를 확인해주세요."; return; }
      if(pw.length<8){ err.textContent="임시 비밀번호는 8자 이상이에요."; return; }
      if(list.some(s=>s.phone===phone)){ err.textContent="이미 있는 번호예요."; return; }
      err.textContent="만드는 중…";
      try{ await callAdmin({action:"create",name,phone,password:pw}); if(window.toast)toast(name+" 계정을 만들었어요 · 아이디 "+fmt(phone)); openAccounts(); }
      catch(x){ err.textContent=x.message; }
    };
    pop().querySelectorAll("[data-acct]").forEach(b=>b.onclick=async()=>{
      const a=b.dataset.acct, phone=b.dataset.p, who=(list.find(s=>s.phone===phone)||{}).name||phone;
      try{
        if(a==="reset"){
          const pw=prompt(who+"님 임시 비밀번호 (8자 이상)"); if(!pw)return;
          if(pw.length<8){ err.textContent="임시 비밀번호는 8자 이상이에요."; return; }
          await callAdmin({action:"reset",phone,password:pw}); if(window.toast)toast(who+"님 임시 비밀번호를 정했어요. 처음 들어올 때 바꾸게 됩니다.");
        }else if(a==="disable"){
          if(!confirm(who+"님 계정을 정지할까요? 바로 로그인할 수 없게 됩니다."))return;
          await callAdmin({action:"disable",phone}); if(window.toast)toast(who+"님 계정을 정지했어요.");
        }else if(a==="enable"){
          await callAdmin({action:"enable",phone}); if(window.toast)toast(who+"님 계정을 다시 쓸 수 있어요.");
        }
        openAccounts();
      }catch(x){ err.textContent=x.message; }
    });
  }

  /* 시작 */
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
  s.onload=async()=>{
    AUTH.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    AUTH.sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT"&&AUTH.staff){ AUTH.staff=null; showLogin("다시 로그인해주세요."); } });
    const {data:{session}}=await AUTH.sb.auth.getSession();
    if(session)await afterLogin(); else showLogin();
  };
  s.onerror=()=>{ box.innerHTML='<h1>릴렉싱 데스크</h1><div class="err">인터넷에 연결되지 않아 로그인할 수 없어요.</div>'; };
  document.head.appendChild(s);
})();
</script>

</body>
</html>
