/* ── 엑셀(xlsx) 파일 만들기 — 외부 라이브러리 없이 압축 없는 zip으로 만든다 ── */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const now=new Date(), dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  files.forEach(f=>{
    const nm=enc.encode(f.name), d=f.data, crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,dt,true); h.setUint32(14,crc,true);
    h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,dt,true); c.setUint32(16,crc,true);
    c.setUint32(20,d.length,true); c.setUint32(24,d.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+d.length;
  });
  const cl=cen.reduce((a,x)=>a+x.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cl,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xEsc=v=>String(v).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function xCol(i){ let s=""; i++; while(i){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
function xSheet(rows,widths){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  if(widths)x+='<cols>'+widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join("")+'</cols>';
  x+='<sheetData>';
  rows.forEach((r,ri)=>{
    x+='<row r="'+(ri+1)+'">';
    r.forEach((v,ci)=>{
      if(v===null||v===undefined||v==="")return;
      const ref=xCol(ci)+(ri+1), st=ri===0?' s="1"':'';
      if(typeof v==="number"&&isFinite(v))x+='<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+xEsc(v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function xlsxBlob(sheets){
  const enc=new TextEncoder(), f=[], add=(n,t)=>f.push({name:n,data:enc.encode(t)});
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  add("[Content_Types].xml",X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+'</Types>');
  add("_rels/.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  add("xl/workbook.xml",X+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    sheets.map((s,i)=>'<sheet name="'+xEsc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+'</sheets></workbook>');
  add("xl/_rels/workbook.xml.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+
    '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  add("xl/styles.xml",X+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FFE8EDF4"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  sheets.forEach((s,i)=>add("xl/worksheets/sheet"+(i+1)+".xml",xSheet(s.rows,s.widths)));
  return zipStore(f);
}
function downloadBlob(blob,name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}

/* 이번 달 본인 회차 ÷ 센터 영업일수 — 오늘 화면과 같은 기준 */
function perOpenDay(name,ym){
  return cache("pod",name+(ym||""),()=>{
    const od=openDaysOf(ym); if(!od)return null;
    return teacherMonthCount(name)/od;
  });
}
function workAvg(name){
  return cache("wk",name,()=>{
    const cut=D(new Date(Date.now()-28*86400000)), t=TODAY(), days={};
    S.members.forEach(m=>(m.att||[]).forEach(a=>{
      if(!a.teacher||a.date>=t||a.date<cut)return;
      if(normName(a.teacher)!==normName(name))return;
      days[a.date]=(days[a.date]||0)+1;
    }));
    const ks=Object.keys(days);
    return ks.length?ks.reduce((s,k)=>s+days[k],0)/ks.length:null;
  });
}

/* 오늘 이 강사가 한 회차 수 (25분=1회) */
/* 이번 달 센터가 며칠 열었나. 수업이 하나라도 있던 날을 센다.
   직접 넣은 값이 있으면 그걸 따른다. */
function openDaysAuto(ym){
  return cache("od",ym,()=>{
    const t=TODAY(), days={};
    S.members.forEach(m=>(m.att||[]).forEach(a=>{
      if(!a.date||a.date>=t||a.date.slice(0,7)!==ym)return;
      days[a.date]=1;
    }));
    return Object.keys(days).length;
  });
}
const openDaysOf=ym=>(+S.workDays||openDaysAuto(ym||ymOf(new Date()))||0);
function teacherTodayCount(name){
  return dayList(TODAY()).filter(x=>normName(x.teacher)===normName(name))
    .reduce((s,x)=>s+x.slots,0);
}
/* 이번 달 1일부터 오늘까지 이 강사가 한 총 회차 수 */
function teacherMonthCount(name){
  const t=TODAY(), start=t.slice(0,7)+"-01";
  let n=0;
  S.members.forEach(m=>(m.att||[]).forEach(a=>{
    if(!a.teacher||a.date>=t||a.date<start)return;   /* 오늘은 아직 안 끝났으니 뺀다 */
    if(normName(a.teacher)===normName(name))n++;
  }));
  return n;
}

function CRITERIA_(){
  return [
    {t:"잊혀진 회원",d:"마지막 수업에서 "+S.goneDays+"일이 지났고, 아직 ‘연락함’을 안 누른 회원. 1회 체험권만 있는 회원과 앞으로 예약이 잡힌 회원은 뺍니다. "+S.goneDays+"~"+(GONE_FAR-1)+"일은 ‘연락할 회원’, "+GONE_FAR+"일부터는 ‘"+GONE_FAR+"일 넘게 안 온 회원’으로 접어 둡니다. 연락함을 누르면 "+RETRY+"일 동안 빠지고, 그래도 안 오면 다시 올라옵니다. 메뉴 배지와 강사별 숫자는 연락할 회원만 셉니다."},
    {t:"만료·소진위험 A",d:"기간(종료일)이 끝났는데 잔여가 1회 이상 남은 수강권. 만료 후 30일까지만 보여주고 그 뒤에는 자동으로 뺍니다(회원 자료에는 그대로 남음). 휴지통 회원도 넣습니다. 1회권 제외. 다른 살아 있는 수강권이 있으면 ‘새 수강권 보유’. 최근에 끝난 순."},
    {t:"만료·소진위험 B",d:"살아 있는 수강권 중, 최근 28일 실제 수업으로 낸 주당 빈도로 만료일까지 쓸 회차(남은 일수 ÷ 7 × 빈도)를 빼도 1회 이상 남는 것. 처음 온 지 28일이 안 됐으면 그날부터 나누고, 수강권이 여러 개면 먼저 끝나는 것부터 쓴다고 보고 나눕니다. 90일 안에 끝나는 것을 위에, 그 안에서 부족분 큰 순. 28일 동안 방문이 없으면 ‘빈도 없음’으로 맨 아래에 따로 묶습니다."},
    {t:"확인이 필요한 재등록",d:"예측 보드에서 손으로 ‘재등록’을 눌렀는데 "+PENDING_DAYS+"일이 지나도록 엑셀에 새 수강권이 안 들어온 건입니다. 결제가 안 됐거나 엑셀을 아직 안 올린 경우예요. 현황 화면에서 확인하거나 기록을 지울 수 있습니다."},
    {t:"지난 날 보기",d:"날짜를 뒤로 넘기면 그날 상태로 보여줍니다. 잔여회차는 그 뒤에 쓴 회차를 도로 더해 역산하고, 그날 이후 끊은 수강권은 빼둡니다. 그 사이 만료·취소된 수강권은 기록이 남지 않아 되살릴 수 없습니다."},
    {t:"오래 안 온 회원",d:"마지막 수업에서 "+S.goneDays+"일 이상 지난 회원 (연락 여부와 상관없이). 재등록 목록과 예측에서는 이 기준으로 빼둡니다."},
    {t:"재등록대상자",d:"릴렉싱 잔여 "+S.limitRelax+"회 이하 또는 리빌딩 잔여 "+S.limitRebuild+"회 이하 (릴렉싱끼리·리빌딩끼리 잔여를 합쳐서 보고, 둘은 합치지 않습니다). 다음 수강권을 미리 끊어 둔 경우 시작 전이어도 잔여에 넣습니다. 지난 날 카드는 그날 갖고 있던 수강권 기준이며, 미리 끊은 수강권은 등록 기록 날짜부터 갖고 있던 것으로 봅니다"},
    {t:"수강권 종류",d:"수강권명에 ‘리빌딩’이 있으면 1회 50분, 아니면(릴렉싱·릴리즈) 1회 25분. 회차는 엑셀 숫자를 그대로 씁니다"},
    {t:"만료",d:"기간이 지났거나 잔여를 다 쓰면 끝난 수강권으로 봅니다"},
    {t:"이탈",d:"살아있는 수강권이 0개가 된 다음 날 이탈로 기록하고 휴지통으로 보냅니다. 나중에 새 수강권이 생기면 스스로 되살아납니다"},
    {t:"휴지통 태그",d:"‘자동’은 수강권이 끝나 프로그램이 넣은 것, ‘수동’은 사람이 이탈 버튼을 눌러 넣은 것입니다"},
    {t:"컴퓨터 구분",d:"‘회사컴’만 쓰기가 됩니다. ‘내 컴퓨터’는 보기 전용으로 열려서, 확인하다 자료가 갈라지는 일을 막습니다"},
    {t:"소진 표시",d:"잔여가 0으로 처음 보인 날을 수강권에 찍어둡니다. 그날이 지나도 ‘소진 완료’로 남습니다"},
    {t:"회원 자료",d:"검사결과지·체험상담지 사진은 이 컴퓨터 브라우저 창고에 저장되고, 설정 → 데이터에서 보관 폴더를 연결하면 원본 사본이 ‘이름_전화끝4자리’ 폴더에 함께 쌓입니다. 백업 파일에는 사진이 들어가지 않으니 보관 폴더를 꼭 연결하세요. 브라우저 기록이 지워지면 ‘폴더에서 되살리기’로 되돌립니다. 다른 컴퓨터에서는 보이지 않습니다"},
    {t:"자료 순서",d:"자료가 있는 회원은 상세를 열면 옆에 자료 썸네일이 뜨고(1건이어도), 첫 번째 자료는 그 아래에 바로 열려 있고, 다른 썸네일을 누르면 그 자료로 바뀝니다(v137). 같은 썸네일을 다시 누르거나 ✕를 누르면 접힙니다. 더 크게 보려면 ‘크게’. 썸네일을 끌거나 ‘맨 앞으로’로 순서를 바꿉니다. 순서를 정해둔 회원은 새 자료가 첫 번째 바로 뒤에 들어갑니다"},
    {t:"체험 기록",d:"엑셀에 없는 체험자를 체험 탭에 적습니다. 적는 대로 저장되고(저장 버튼 없음), 서버 버전이면 다른 기기에 1~2초 뒤 보입니다. 아무것도 안 적고 닫으면 남기지 않습니다. 예전 양식의 운동·수면·식사는 옛 기록에서만 보입니다"},
    {t:"신체 그림·순위",d:"여성/남성 앞·뒤 근육 칸 그림(v124). 불편한 곳을 누르면 누른 자리 그대로 점이 찍히고(다시 누르면 지움), 그 자리 칸의 쉬운 부위 이름(약 120개, 오른쪽·왼쪽 자동)이 예상으로 붙습니다. 선 위나 테두리 바로 밖을 눌러도 점은 그 자리, 이름은 가장 가까운 칸. 부위 이름은 컴퓨터 입력 화면에서 고칠 수 있고(순위 칸의 이름 · 점 이름 누르기, 비우면 예상 이름으로), 서명 화면에서는 못 고칩니다. 번호를 다른 자리로 옮기면 새 자리 이름으로 다시 붙습니다. 성별을 바꾸면 점이 몸 폭 비율로 옮겨가고 고친 이름은 그대로입니다. v124 전에 점을 찍은 기록은 예전 그림으로 보입니다. 1~5번 버튼을 그림에 끌어다 놓으면 그 번호가 해결하고 싶은 순위가 되고, 그림 밖으로 끌어내면 빠집니다. 순위별 설명은 컴퓨터에서 적습니다. 앞모습은 그림 왼쪽이 회원의 오른쪽입니다"},
    {t:"수업 집계 (v130)",d:"센터 프로그램의 예약 내역 엑셀(수업일·강사·회원명·수강권명·예약상태)을 끌어다 놓으면 ① 강사별 수업 수·수업료 ② 이번 달 누적 ③ 수업 메모 명단을 한 번에 채웁니다(수업목록은 따로 안 올려도 됨). 한 줄 = 수업 1개: 25분 수강권(릴렉싱·릴리즈·스페셜케어·리셋 25분)은 25·30분 한 줄이 25분 1개(50분 수업이면 두 줄), 50분 수강권(리빌딩·리셋 패키지 50분)은 50·60분 한 줄이 50분 1개. 줄 길이(45분 이상이면 50분 줄)와 수강권이 안 맞으면 ‘고칠 줄’로 따로 보여 주고, 센터 프로그램에서 고쳐 다시 올리기 전까지 금액에서 뺍니다(‘고치면 +○원’). 단가 구간은 수강권 이름의 횟수: 29회 이하 1회 단가(35,000원), 30~49회 30회 단가(25,000원), 50회 이상 50회 단가(23,000원), 리빌딩 50,000원. 스페셜케어·리셋 패키지 25분은 30회 단가, 리셋 패키지(50분)는 리빌딩. 같은 구간이어도 수강권별로 따로 보여 줍니다. 노쇼·결석·당일취소도 수업으로 셉니다. 어제까지는 ‘한 수업’, 오늘·앞날은 ‘예약’. 이번 달: 어제까지 한 수업 · 마지막 수업일 하루 · 예약 포함(최소) · 지금 속도면(지금까지 수업료 ÷ 지난 수업일 × 이번 달 수업일, 평일 자동·직접 바꿈) · 지난달 같은 수업일 수까지 비교. 범위: 파일 이름의 날짜부터 바꾸고, 앞날 예약이 든 파일은 그 달 말일까지 바꿉니다(취소된 예약이 남지 않게). 강사 1명만 든 파일은 그 강사 줄만 바꿉니다. 각 샘 수업 메모 맨 위에는 자기 숫자만 보입니다. 수업료 기준이며 급여가 아닙니다. 전화번호는 끝 4자리만 저장합니다."},{t:"급여 (v131)",d:"계약서 제3·4조대로 계산합니다. 월 임금(세전) = 기본급(트레이너 70만·파트장 100만) + 인센티브 + 기타 수당. 인센티브 = 실매출 × 등급 요율(원 미만 올림). 실매출 = 수업 집계의 수업료에서 부가세(÷1.1)와 카드수수료(%)를 뺀 값. 등급은 가매출 = (그 샘이 판 수강권 결제 합계 − 환불)에서 같은 공제를 한 값으로 정합니다: 500만 미만 F 30%/32%, 500만~ E 32/34, 800만~ D 34/36, 1,100만~ C 36/38, 1,300만~ B 38/40, 1,500만~ A 40/42 (트레이너/파트장). 등급이 오르면 실매출 전체에 새 요율. 결제 합계·환불·기타 수당·조정·명세서 인센티브는 파트장이 넣고, 서버 pay 표에 저장돼 관리자는 전부·각 샘은 자기 것만 읽을 수 있습니다(변경 기록에도 안 남김). 직급·기본급·요율표·공제율은 모두에게 같은 규칙이라 설정에 둡니다. 관리자 표는 '급여 표 열기'를 눌러야 보이고 10분 뒤 저절로 닫힙니다. '샘들에게 보이기'를 켜면 각 샘 수업 메모 맨 위에 자기 예상 급여만 보입니다(로그인한 본인 화면에서만). 지난달을 고르면 '명세서 인센티브'를 넣어 계산과의 차이(%)를 볼 수 있습니다. 단가는 고른 달부터 적용되고 그 전 달 숫자는 바뀌지 않습니다. 최저임금 보전수당은 계산하지 않습니다."},{t:"방문 흐름 · 방문 달력 (v132)",d:"오는 시간 탭의 ‘방문 흐름’은 출석 기록만으로 누가 평소보다 덜 오는지를 달 단위로 보여 줍니다. 대상은 석 달 넘게 다녔고, 그 달 15일까지 수강권이 살아 있고, 그 전 석 달 동안 한 달 평균 2일 이상 온 회원입니다. 그 달에 한 번도 안 오면 ‘안 옴’, 평소(그 전 석 달의 한 달 평균 방문일)의 절반 이하면 ‘줄어듦’, 그 밖은 ‘평소대로’. 줄어든 회원 목록 · 달마다 막대 · 강사별 막대가 모두 이 한 가지 기준을 씁니다. 달 막대를 누르면 그 달의 명단으로 바뀝니다. 지난 달들에는 지금 휴지통에 있는 회원도 그때 다니던 회원으로 셉니다(숫자·막대·강사별). 줄어든 회원 명단에서는 휴지통 회원을 뺍니다(v135). 강사 화면에서는 자기 책임 회원만 봅니다. 회원 상세 맨 아래 ‘방문 달력’은 최근 6개월(1년까지)을 달력으로 보여 줍니다: 온 날에 색(1회차 연하게, 2회차 이상 진하게), 잡힌 예약은 테두리, 수강권 시작한 날은 검은 테두리. 백업 파일에는 이 프로그램의 자료만 담고(로그인 정보·다른 프로그램 자료 제외), 백업 되돌리기는 출석 기록과 강사까지 그대로 되돌립니다."},
    {t:"체험 상담 확인서 (v128)",d:"서명하면 A4 확인서가 만들어집니다: 머리(문서번호 T-날짜-순번)·회원 정보·01 불편한 곳과 순위(그림 + 순위별 설명 + 그 밖에 불편한 곳)·02 상담 메모·03 확인 및 동의·서명. 메모가 넘치면 다음 쪽으로 이어지고, 동의와 서명은 함께 마지막 쪽(서명은 쪽 아래)에 둡니다. 문서번호는 서명하는 순간 그날 순서대로 붙고 회원 상세 체험 상담 칸·상담 화면에 보입니다. 저장은 이미지(쪽마다 한 장)이고, PDF가 필요하면 자료 보기의 ‘인쇄·PDF’ → 인쇄 창에서 ‘PDF로 저장’. 이전에 서명한 동의서는 그대로입니다."},
    {t:"체험 기록 이름 (v127)",d:"등록된 회원(‘회원’ 표시)은 이름을 누르면 회원 상세가 열립니다 — 상세의 ‘체험 상담’ 칸에 그림·순위·상담 메모·추가 메모가 있고, ‘상담 열기’로 상담 입력 화면으로 갑니다. 상담 입력 화면 위 ‘회원 상세’로 반대로도 갑니다. 미등록 체험(연결 후보 포함)은 이름을 누르면 상담 입력 화면. 몸 그림은 앞·뒤 모두 그림 위 양쪽에 왼쪽/오른쪽이 적혀 있습니다(앞은 그림 왼쪽이 회원 오른쪽)."},
    {t:"상담 화면 (#상담, 태블릿)",d:"v125. 태블릿은 인터넷 주소 끝에 #상담 을 붙여 엽니다(홈 화면 아이콘 권장). 로그인 뒤 ‘오늘 상담’ — 오늘 만든 체험 중 서명 안 한 이름과 만든 시각만 나오고, 이름을 누르면 회원용 화면: ① 불편한 곳(그림·1~5 순위) ② 해결하고 싶은 것 ③ 상담 메모 ④ 서명(동의 체크 2개·문구·서명 칸)만 보입니다. 메뉴·체험 기록·전화번호·강사 이름·지우기 버튼은 안 보이고, 전체 프로그램으로 나갈 수 없습니다(‘목록’은 오늘 상담 목록으로만). 화면 크기에 비례해 맞춰지고(글자 = 화면 짧은 변의 약 2.3%), 세로는 한 줄, 가로는 왼쪽 그림·오른쪽 나머지 두 칸입니다. 서명하면 ‘고맙습니다’가 뜨고 6초 뒤 목록으로 돌아갑니다. 순위 설명·상담 메모·부위 이름은 컴퓨터에서만 고칩니다"},

      '<li>칸마다 실제 재등록률이 센터 평균보다 높고 낮은 만큼을 점수로 바꿔 기본 점수에 더합니다.</li>'+

/* ── 파일 처리 결과 ── */
function logPanel(){
  if(!S.log)return "";
  const L=S.log;
  const ICON={wait:"…",read:"읽는 중",queued:"대기",work:"넣는 중",done:"완료",fail:"실패",skip:"건너뜀"};
  let h='<div class="logbox'+(L.busy?" busy":"")+'"><div class="logh">'+
    (L.busy?'<span class="spin"></span>파일을 읽고 있어요':'파일 처리 결과')+
    '<span style="flex:1"></span><button class="btn sm" data-a="logclose">닫기</button></div>';
  L.items.forEach(it=>{
    const bad=it.state==="fail"||it.state==="skip";
    h+='<div class="logr'+(bad?" bad":(it.state==="done"?" ok":""))+'">'+
      '<span class="st">'+ICON[it.state]+'</span>'+
      '<div><b>'+esc(it.name)+'</b>'+(it.msg?'<span> · '+esc(it.msg)+'</span>':"")+
      ((it.detail||[]).length?'<ul>'+it.detail.map(d=>'<li>'+esc(d)+'</li>').join("")+'</ul>':"")+
      '</div></div>';
  });
  if(!L.busy&&(L.next||[]).length){
    h+='<div class="lognext"><div class="lnh">이제 이걸 하시면 돼요</div>';
    L.next.forEach(s=>{
      h+='<div class="lnrow"><div><b>'+esc(s.title)+'</b><span>'+esc(s.body)+'</span></div>'+
        (s.btn?'<button class="btn sm key" data-a="'+s.act+'">'+esc(s.btn)+'</button>':"")+'</div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

function mapCols(headers,fields){
  const map={}, used=new Set();
  const n=h=>String(h??"").replace(/\s/g,"");
  fields.forEach(f=>{
    let hit=-1;
    headers.forEach((h,i)=>{ if(hit>=0||used.has(i))return;
      const t=n(h); if(!t)return;
      if(f.syn.some(k=>t===n(k)))hit=i; });
    if(hit<0)headers.forEach((h,i)=>{ if(hit>=0||used.has(i))return;
      const t=n(h); if(!t)return;
      if(f.syn.some(k=>t.includes(n(k))))hit=i; });
    if(hit>=0){ map[f.k]=hit; used.add(hit); }
  });
  return map;
}
async function sniff(file){ return (await sniffDetail(file)).kind; }
async function sniffDetail(file){
  const nm=(file.name||"").toLowerCase();
  if(/\.json$/.test(nm)){
    try{
      const j=JSON.parse(await file.text());
      if(j&&Array.isArray(j.members))return {kind:"backup",heads:[]};
      return {kind:"unknown",heads:[],why:"백업 파일 모양이 아니에요"};
    }catch(e){ return {kind:"bad",heads:[],why:"파일이 깨졌어요"}; }
  }
  let rows;
  try{ rows=await readTable(file); }
  catch(e){ return {kind:"bad",heads:[],why:"파일을 열지 못했어요 ("+e.message+")"}; }
  const heads=(rows[0]||[]).map(h=>String(h??"").trim()).filter(Boolean);
  const hs=heads.map(h=>h.replace(/\s/g,""));
  const has=rx=>hs.some(h=>rx.test(h));
  if(has(/수업일/)&&has(/수강권명/)&&has(/예약상태/))return {kind:"lessons",heads};     /* 예약 내역 → 수업 집계 */
  const cls=has(/수업일/)&&has(/수업명|회원명/);
  const mem=has(/잔여/)&&(has(/전체회차|총회차|총횟수/)||has(/종료일|만료/));
  if(cls&&!mem)return {kind:"classes",heads};
  if(mem&&!cls)return {kind:"members",heads};
  if(cls&&mem)return {kind:has(/수업일/)?"classes":"members",heads};
  const why=[];
  if(!rows.length)why.push("내용이 비어 있어요");
  else{
    if(!has(/잔여/))why.push("회원목록이라면 ‘잔여회차’ 열이 있어야 해요");
    if(!has(/수업일/))why.push("수업목록이라면 ‘수업일’ 열이 있어야 해요");
  }
  return {kind:"unknown",heads,why:why.join(" · ")};
}

/* ===================== 수업 집계 (v130 · 단가 이력 v131) =====================
   센터 프로그램의 '예약 내역' 엑셀(수업일·수업시작·수업종료·강사·회원명·수강권명·예약상태 …) 하나로
   ① 강사별 수업 수·수업료(단가 구간 1회 / 30회 / 50회 / 리빌딩, 수강권별)
   ② 이번 달 누적(어제까지 한 수업 · 남은 예약 · 지금 속도면 월말)
   ③ 수업 메모 명단(수업목록 대신)
   을 한 번에 채운다.
   · 한 줄 = 수업 1개. 25분 수강권(릴렉싱·릴리즈·스페셜케어·리셋 25분)은 25·30분 줄 = 25분 1개 — 50분 수업이면 두 줄로 나온다.
     50분 수강권(리빌딩·리셋 패키지 50분)은 50·60분 줄 = 50분 1개.
   · 줄 길이(45분 이상 = 50분 줄)와 수강권 길이가 안 맞으면 '고칠 줄' — 센터 프로그램에 잘못 쓴 것.
     고쳐서 다시 올리기 전까지 금액에서 빼고 "고치면 +○원"으로 보여 준다.
   · 구간: 수강권 이름의 횟수 29회 이하 → 1회 단가, 30~49 → 30회, 50 이상 → 50회.
     스페셜케어·리셋 패키지 25분 → 30회 단가, 리빌딩·리셋 패키지(50분) → 리빌딩. 숫자가 없으면 '확인 필요'.
   · 예약상태는 따지지 않는다(노쇼·결석·당일취소도 수업). 미리 취소된 예약은 파일에 아예 없다.
   · 어제까지의 줄 = 한 수업, 오늘·앞날 줄 = 예약.

/* ===================== 급여 (v131) =====================
   계약서 제3·4조:
   · 월 임금(세전) = 기본급 + 인센티브 + 기타 수당. 1일~말일 정산, 다음 달 10일 지급.

   · 인센티브 = 개인 월 '실매출' × 등급 요율 (원 미만 올림)
       실매출 = 실제 한 수업 × 회당 금액 − 부가세 − 카드수수료 − 환불   ← 수업 집계 금액에서 공제

   · 규칙(직급·기본급·요율표·공제)은 모두에게 같으므로 settings(payCfg)에 둔다.

     — 관리자는 전부, 강사는 자기 줄만 읽는다(05_급여표.sql). 이 칸은 이 컴퓨터에 저장하지 않는다.
   · 서버 없이 쓰는 파일 모드에서는 S.payLocal에 둔다(한 컴퓨터 전용). */
const PAY_DEF={base:{tr:700000,pt:1000000},
  tiers:[{min:0,g:"F",tr:30,pt:32},{min:5000000,g:"E",tr:32,pt:34},{min:8000000,g:"D",tr:34,pt:36},
         {min:11000000,g:"C",tr:36,pt:38},{min:13000000,g:"B",tr:38,pt:40},{min:15000000,g:"A",tr:40,pt:42}]};

function payCfg(){ const c=S.payCfg||{};
  return {base:Object.assign({},PAY_DEF.base,c.base||{}),tiers:(Array.isArray(c.tiers)&&c.tiers.length?c.tiers:PAY_DEF.tiers).slice().sort((a,b)=>a.min-b.min),
    vat:c.vat!==false,card:Math.max(0,+c.card||0),show:!!c.show,rank:c.rank||{}}; }
const PAY={rows:{},at:0,loading:false,missing:false,err:"",openAt:0,ym:null};
const payKey=(ym,sid)=>ym+"|"+sid;
const payServer=()=>!!(typeof SYNC!=="undefined"&&SYNC.on&&SYNC.sb);
const payMeId=()=>payServer()?((SYNC.me||{}).id||null):S.me;
const payAdmin=()=>payServer()?!!SYNC.admin:!S.ro;
const payOpen=()=>payAdmin()&&Date.now()-PAY.openAt<10*60*1000;   /* 전체 표는 연 뒤 10분이면 저절로 닫힌다 */

async function payLoad(force){

    else{ PAY.rows={}; (data||[]).forEach(r=>PAY.rows[r.id]=r); PAY.missing=false; PAY.err=""; }

async function paySave(ym,sid,patch){

/* 공제: 부가세(÷1.1) → 카드수수료(%) */
function payNet(v){ const c=payCfg(); let x=+v||0; if(c.vat)x/=1.1; return x*(1-c.card/100); }
function payTier(sales){ const t=payCfg().tiers; let r=t[0]; t.forEach(z=>{ if(sales>=z.min)r=z; }); return r; }
const payNext=sales=>payCfg().tiers.find(z=>z.min>sales)||null;
const payRank=sid=>payCfg().rank[sid]==="pt"?"pt":"tr";
/* 강사 한 명·한 달 — gross: 어제까지 수업료, grossE: 월말 예상 수업료 */
function payCalc(ym,sid,gross,grossE){
  const c=payCfg(), v=payGet(ym,sid)||{}, rk=payRank(sid);
  const has=v.paid!=null&&v.paid!=="";
  const paid=+v.paid||0, refund=+v.refund||0, sales=payNet(paid-refund);
  const tier=payTier(sales), rate=(+tier[rk]||0)/100, nx=payNext(sales);
  const real=payNet(gross), inc=Math.ceil(real*rate-1e-9);
  const realE=payNet(grossE), incE=Math.ceil(realE*rate-1e-9);
  const base=+c.base[rk]||0, extra=+v.extra||0, adj=+v.adj||0;
  let up=null; if(nx){ const r2=(+nx[rk]||0)/100; up={need:nx.min-sales,g:nx.g,pct:+nx[rk]||0,gain:Math.ceil(realE*r2-1e-9)-incE}; }
  const stmt=v.stmt!=null&&v.stmt!==""?+v.stmt:null;
  return {rk,has,paid,refund,sales,tier,pct:+tier[rk]||0,rate,real,inc,realE,incE,base,extra,adj,
    total:base+inc+extra+adj,totalE:base+incE+extra+adj,up,stmt,gap:stmt?(inc-stmt)/stmt*100:null,memo:v.memo||""};
}
/* 한 달 강사별 수업료: 이번 달 = 어제까지 + 지금 속도면, 지난달 = 한 달 전체 */

  lesAgg(lesRowsOf(ym).filter(x=>x.d<today)).list.forEach(o=>out[o.name]={amt:o.amt,est:o.amt});
  return {out,cur:false,M:null};

    from:nameFrom||minD,to:nameTo||maxD,byName:!!span};
}

  const n=+s;
  if(!isNaN(n)&&n>0&&n<1)return minTo(Math.round(n*1440));
  return s;
}

   되돌리기 전에 지금 상태를 먼저 따로 저장해둔다. */
function restoreDump(dump){
  if(!dump||typeof dump!=="object")throw new Error("백업 파일이 아니에요");
  let keep=null; try{ keep=localStorage.getItem(KEY); }catch(e){}
  /* v132: 화면 상태(회원·출석·강사 전부)가 들어 있으면 그걸로 되돌린다.
     예전에는 저장소 원본을 먼저 썼는데, 서버에서 쓰던 컴퓨터의 저장소 원본은 오래된 것이라 출석 기록과 강사가 빠졌다.
     또 저장소 원본에는 로그인 토큰과 다른 프로그램 자료가 섞여 있을 수 있어서, 이 프로그램의 저장본(KEY) 말고는 건드리지 않는다. */
  if(Array.isArray(dump.members)){
    try{ localStorage.setItem("rd_before_restore",keep||""); }catch(e){}
    S.staff=dump.staff||[]; S.members=dump.members||[]; S.regs=dump.regs||[];
    if(dump.me!==undefined)S.me=dump.me;
    ["limitRelax","limitRebuild","goneDays","lostDays","workDays","lastImport","acts2","sharedAt","autoShare","box","trials","lessons","lesRules","lesPrice","lesDays","lesPriceHist","payCfg","payLocal"]
      .forEach(k=>{ if(dump[k]!==undefined)S[k]=dump[k]; });
    if(typeof clearCache==="function")clearCache();
    save();
    return;
  }
  /* 화면 상태가 없는 백업 — 이 프로그램의 저장본만 되돌린다 */
  if(dump._localStorage&&typeof dump._localStorage==="object"&&dump._localStorage[KEY]){
    localStorage.setItem("rd_before_restore",keep||"");
    localStorage.setItem(KEY,dump._localStorage[KEY]);
    if(!load())throw new Error("되돌린 자료를 읽지 못했어요");
    return;
  }
  throw new Error("백업 파일이 아니에요");
}

      msg:KINDNAME[d.kind]?KINDNAME[d.kind]+"으로 읽었어요":"무슨 파일인지 모르겠어요",detail});
  }
  const rank={backup:0,members:1,classes:2,lessons:3};
  queue=tagged.filter(x=>rank[x.kind]!==undefined).sort((a,b)=>rank[a.kind]-rank[b.kind]);
  if(!queue.length){ S.log.busy=false; render(); return; }
  runQueue();
}

/* 수업목록에 나오는데 강사 목록에 없는 이름 (많이 가르친 순) */
function unknownTeachers(){
  const t=TODAY(), n={};
  S.members.forEach(m=>(m.att||[]).forEach(a=>{
    if(!a.teacher||a.date>=t)return;
    const k=normName(a.teacher); if(!k)return;
    if(S.staff.some(s=>normName(s.name)===k))return;
    n[k]=(n[k]||0)+1;
  }));
  return Object.keys(n).map(k=>({name:k,n:n[k]})).sort((a,b)=>b.n-a.n);
}
function addStaffNames(names){
  let n=0;
  names.forEach(nm=>{
    const k=normName(nm); if(!k)return;
    if(S.staff.some(s=>normName(s.name)===k))return;
    S.staff.push({id:uid("s"),name:k}); n++;
  });
  return n;
}

/* 책임자 자동 지정 — 수업을 가장 많이 한 강사 */
function autoStaff(quiet){
  let n=0;
  live().forEach(m=>{
    if(m.staffId)return;
    const g=guessStaff(m); if(!g)return;
    m.staffId=g.id; n++;
  });
  if(n&&!quiet)toast(n+"명 책임자를 정했어요.");
  return n;
}

/* CSV 한 줄 안전하게 감싸기 */
function csvCell(v){
  const s=v===null||v===undefined?"":String(v);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function exportCsv(filename,headers,rows){
  const lines=[headers.map(csvCell).join(",")].concat(rows.map(r=>r.map(csvCell).join(",")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download=filename;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function exportMigration(){
  const raw=localStorage.getItem(KEY); if(!raw){ toast("이 컴퓨터에 저장된 자료가 없어요."); return; }
  toast("이전 파일을 만드는 중…");
  const b64=blob=>new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=()=>no(r.error); r.readAsDataURL(blob); });
  const docs=[];
  for(const d of (DOCS.list||[])){
    const pages=[];
    for(const p of (d.pages||[])){ if(!p.blob)continue; pages.push({w:p.w||null,h:p.h||null,pdf:!!(p.pdf||d.pdf),b64:await b64(p.blob)}); }
    if(pages.length)docs.push({id:d.id,memberId:d.memberId,member:d.member,date:d.date,kind:d.kind,savedAt:d.savedAt,by:d.by||"",pdf:!!d.pdf,fname:d.fname||null,pages});
  }
  const out={kind:"relaxdesk-migration",v:1,at:new Date().toISOString(),box:S.box||"",data:JSON.parse(raw),docs};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));
  a.download="릴렉싱데스크_서버이전_"+TODAY()+".json"; a.click();
  logAct("서버 이전 파일","자료 "+docs.length+"건 포함");
  toast("서버 이전 파일을 받았어요 · 자료 "+docs.length+"건 포함");
}

let dragId=null, dragReg=null;   // 예측 보드에서 드래그 중인 회원 id / 등록기록 id
/* ── 되돌리기 ──
   무엇을 바꾸기 직전에 지금 상태를 찍어둔다.
   화면만 옮기는 동작은 찍지 않는다(되돌릴 게 없으니). */
let undoStack=[], redoStack=[];
const UNDO_MAX=15;
/* 되돌릴 필요 없는 동작 — 보기만 바꾸는 것들 */
const NO_UNDO=["me","tab","settab","open","close","closepop","filter","filter2","more","stat",
  "logclose","dnav","dpick","exportmembers","exportstaff","exportregs","backup","migexport","share",
  "restorepick","pick","canceledit","startedit","startnameedit","memoedit","savememoedit","nameedit","undo","redo","clearlog","fold","foldall","rpf","rpsort","rpg","critall"];
function snapshot(){
  const pk=packAtt(S.members);
  return JSON.stringify({tnames:pk.tnames,members:pk.members,staff:S.staff,regs:S.regs,trials:S.trials});
}
function pushUndo(label){
  if(HOSTED){ if(SYNC.on)syPushUndo(label); return; }
  try{
    undoStack.push({label:label||"",at:Date.now(),data:snapshot()});
    if(undoStack.length>UNDO_MAX)undoStack.shift();
    redoStack=[];   /* 새로 바꾸면 '다시 하기'는 사라진다 */
  }catch(e){}
}
function restoreSnap(data){
  const d=JSON.parse(data);
  S.members=unpackAtt(d.members,d.tnames||[]);
  S.staff=d.staff||[]; S.regs=d.regs||[]; if(Array.isArray(d.trials))S.trials=d.trials;
}
function doUndo(){
  if(HOSTED){ if(SYNC.on)syDoUndo(); return; }
  const u=undoStack.pop();
  if(!u){ toast("되돌릴 게 없어요."); return; }
  try{
    const now=snapshot();
    restoreSnap(u.data);
    redoStack.push({label:u.label,at:u.at,data:now});
    clearCache(); save(); render();

/* 되돌리기 취소 */
function doRedo(){
  if(HOSTED){ if(SYNC.on)syDoRedo(); return; }
  const u=redoStack.pop();
  if(!u){ toast("다시 할 게 없어요."); return; }
  try{
    const now=snapshot();
    restoreSnap(u.data);
    undoStack.push({label:u.label,at:u.at,data:now});
    clearCache(); save(); render();
    toast((u.label?u.label+" — ":"")+"다시 했어요");
  }catch(e){ redoStack.push(u); toast("다시 하지 못했어요."); }
}

/* ===================== 회원 자료 (검사결과지·체험상담지) =====================
   사진은 무거워서 기존 저장소(localStorage)와 따로 둔다.
   · 창고: 브라우저 대용량 저장소(IndexedDB) — 보기용, 빠름
   · 보관 폴더: 회사컴의 진짜 폴더 — 원본 사본. 창고가 비워져도 여기서 되살린다
   나중에 서버로 옮길 때는 이 칸의 docStore* 함수만 바꾸면 된다. */
const DOC_KINDS=["검사결과지","체험상담지"];
const DOC_MAX_EDGE=2400, DOC_Q=0.85;
const DOCS={db:null,list:[],dir:null,ready:false,failed:false};
const DV={mid:null,id:null,page:0,add:false,full:false,open:false};   /* open: 썸네일을 눌러 연 자료가 있나 (v136) */           /* 지금 보고 있는 자료 */
const DP={pages:[],kind:DOC_KINDS[0],date:null};                    /* 넣기 전 대기 */
const DURL=new Map();                                               /* 사진 미리보기 주소 */

function docStoreOpen(){
  return new Promise((ok,no)=>{
    let r; try{ r=indexedDB.open("reldesk-docs",1); }catch(e){ no(e); return; }
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("docs"))d.createObjectStore("docs",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta"); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);
  });
}
const docReq=q=>new Promise((ok,no)=>{ q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error); });
const docOS=(s,mode)=>DOCS.db.transaction(s,mode||"readonly").objectStore(s);
const docStoreAll=()=>docReq(docOS("docs").getAll());
const docStorePut=v=>HOSTED?syDocPut(v):docReq(docOS("docs","readwrite").put(v));
const docStoreDel=id=>HOSTED?syDocDel(id):docReq(docOS("docs","readwrite").delete(id));
const docMetaGet=k=>docReq(docOS("meta").get(k));
const docMetaPut=(k,v)=>docReq(docOS("meta","readwrite").put(v,k));

async function docsInit(){
  if(HOSTED)return;          /* 인터넷 주소: 로그인 뒤 서버에서 불러온다 */
  try{
    DOCS.db=await docStoreOpen();
    DOCS.list=await docStoreAll();
    if(typeof window.showDirectoryPicker==="function"){ try{ DOCS.dir=(await docMetaGet("dir"))||null; }catch(e){} }
  }catch(e){ DOCS.failed=true; }
  DOCS.ready=true;
  render();
}
const docOwners=m=>{ const s=new Set([m.id]); (S.trials||[]).forEach(t=>{ if(t.memberId===m.id)s.add(t.id); }); return s; };
/* 순서: 손으로 정한 순서(m.docOrder)가 있으면 그 첫 번째를 맨 앞에 두고,
   새로 들어온 자료(순서에 없는 것)는 날짜순으로 그 바로 뒤, 나머지 정한 순서가 그다음 */
const docsOf=m=>{ const o=docOwners(m);
  const base=DOCS.list.filter(d=>o.has(d.memberId))
    .sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.savedAt<a.savedAt?-1:1));
  const ord=m.docOrder||[]; if(!ord.length)return base;
  const inOrd=ord.map(id=>base.find(d=>d.id===id)).filter(Boolean), rest=base.filter(d=>ord.indexOf(d.id)<0);
  return inOrd.length?[inOrd[0]].concat(rest,inOrd.slice(1)):base; };
function docReorder(m,id,to){
  const ids=docsOf(m).map(d=>d.id), from=ids.indexOf(id); if(from<0||to<0||from===to)return;
  pushUndo("자료 순서 · "+m.name); ids.splice(from,1); ids.splice(to,0,id);
  m.docOrder=ids; DV.id=id; DV.page=0; save(); render();
  if(to===0)toast("맨 앞으로 옮겼어요. 상세를 열면 이 자료가 먼저 떠요.");
}
const docCount=m=>DOCS.ready?docsOf(m).length:0;
function docURL(d,p){
  const k=d.id+":"+p;
  if(HOSTED&&!DURL.has(k)){ const b=syDocBlob(d,p); if(!b)return "data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="; DURL.set(k,URL.createObjectURL(b)); }
  if(!DURL.has(k))DURL.set(k,URL.createObjectURL(d.pages[p].blob));
  return DURL.get(k);
}
function docURLclear(){ DURL.forEach(u=>URL.revokeObjectURL(u)); DURL.clear(); DP.pages.forEach(p=>URL.revokeObjectURL(p.url)); }

/* ── 사진 줄이기 — 결과지 글씨가 읽히도록 긴 변 2400px ── */
function docShrink(file){
  return new Promise((ok,no)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,DOC_MAX_EDGE/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(u); b?ok({blob:b,w,h}):no(new Error("변환 실패")); },"image/jpeg",DOC_Q);
    };
    im.onerror=()=>{ URL.revokeObjectURL(u); no(new Error("사진을 읽지 못했어요")); };
    im.src=u;
  });
}
async function docAddFiles(files){
  const isPdf=f=>f&&(f.type==="application/pdf"||/\.pdf$/i.test(f.name||""));
  files=Array.from(files||[]).filter(f=>f&&((f.type&&f.type.indexOf("image/")===0)||isPdf(f)));
  if(!files.length){ toast("사진이나 PDF 파일만 넣을 수 있어요."); return; }
  for(const f of files){
    try{
      if(isPdf(f)){ const b=new Blob([await f.arrayBuffer()],{type:"application/pdf"});
        DP.pages.push({blob:b,pdf:true,name:f.name||"PDF",url:URL.createObjectURL(b)}); continue; }
      const r=await docShrink(f); r.url=URL.createObjectURL(r.blob); DP.pages.push(r); }
    catch(e){ toast(e.message||"파일을 읽지 못했어요"); }
  }
  DV.add=true; paintDocs();
}

/* 날짜·종류 고치기 — 창고 기록을 고치고, 보관 폴더의 파일 이름도 새로 맞춘다 */
async function docRedate(id,date,kind){
  const d=DOCS.list.find(x=>x.id===id); if(!d)return;
  if(DOCS.list.some(x=>x.id!==id&&x.memberId===d.memberId&&x.date===date&&x.kind===kind)){
    toast("같은 날짜·종류 자료가 이미 있어요."); paintDocs(); return; }
  const old={date:d.date,kind:d.kind}, oldNames=docFileNames(d), oldF=d.fname;
  d.date=date; d.kind=kind;
  if(d.pdf){ const mm=byId(S.members,d.memberId)||{id:d.memberId}; d.fname=docPdfName(mm,d); }
  try{ await docStorePut(d); }catch(e){ Object.assign(d,old); d.fname=oldF; toast("고치지 못했어요."); paintDocs(); return; }
  DOCS.list.sort((a,b)=>b.date.localeCompare(a.date)||b.savedAt.localeCompare(a.savedAt));
  logAct("자료 고침",d.member+" · "+old.date+" "+old.kind+" → "+date+" "+kind);
  let msg="고쳤어요.";
  const m=byId(S.members,d.memberId);
  if(DOCS.dir&&m){
    try{
      if(await docPerm(true)!=="granted")throw 0;
      await docWriteFolder(m,d);
      const sub=await DOCS.dir.getDirectoryHandle(docFolderName(m));
      const nowNames=docFileNames(d);
      for(const nm of oldNames){ if(nowNames.indexOf(nm)<0){ try{ await sub.removeEntry(nm); }catch(e){} } }
      msg="고쳤어요. 보관 폴더 파일 이름도 바꿨어요.";
    }catch(e){ msg="고쳤어요. 보관 폴더 파일 이름은 못 바꿨어요."; }
  }
  save(); render(); toast(msg);
}
/* ── 보관 폴더 ── */
const docSafe=s=>String(s).replace(/[\\/:*?"<>|]/g,"_").trim();
const phone4=m=>String(m.phone||"").replace(/\D/g,"").slice(-4);
const docFolderName=m=>docSafe(m.name+(phone4(m)?"_"+phone4(m):""));
async function docPerm(ask){
  if(!DOCS.dir)return "none";
  const o={mode:"readwrite"};
  let s=await DOCS.dir.queryPermission(o);
  if(s!=="granted"&&ask)s=await DOCS.dir.requestPermission(o);   /* 누른 순간이라야 허용 창이 뜬다 */
  return s;
}
/* 폴더 파일 이름: 사진은 '날짜_종류_N쪽.jpg', PDF는 '날짜_종류.pdf' (같은 날 같은 종류 PDF가 또 있으면 _2, _3) */
function docPdfName(m,rec){
  const own=docOwners(m), used=new Set(DOCS.list.filter(d=>d.pdf&&d.id!==rec.id&&own.has(d.memberId)).map(d=>d.fname));
  let n=1, nm; do{ nm=docSafe(rec.date+"_"+rec.kind+(n>1?"_"+n:"")+".pdf"); n++; }while(used.has(nm)); return nm;
}
const docFileNames=rec=>rec.pdf?[rec.fname||docSafe(rec.date+"_"+rec.kind+".pdf")]:rec.pages.map((p,i)=>docSafe(rec.date+"_"+rec.kind+"_"+(i+1)+"쪽.jpg"));
async function docWriteFolder(m,rec){
  const sub=await DOCS.dir.getDirectoryHandle(docFolderName(m),{create:true});
  const names=docFileNames(rec);
  for(let i=0;i<rec.pages.length;i++){
    const fh=await sub.getFileHandle(names[i],{create:true});
    const w=await fh.createWritable(); await w.write(rec.pages[i].blob); await w.close();
  }
  return sub.name;
}
async function docPickDir(){
  if(typeof window.showDirectoryPicker!=="function"){ toast("이 브라우저는 폴더 연결이 안 돼요. 크롬으로 열어주세요."); return; }
  try{
    DOCS.dir=await window.showDirectoryPicker({id:"reldesk-docs",mode:"readwrite"});
    await docMetaPut("dir",DOCS.dir);
    logAct("보관 폴더 연결",DOCS.dir.name); save(); render(); toast("보관 폴더를 연결했어요: "+DOCS.dir.name);
  }catch(e){ if(e.name!=="AbortError")toast("폴더를 연결하지 못했어요."); }
}
/* 폴더 → 창고. 회원은 '이름_끝4자리' 폴더로 찾고, 이미 있는 건 건너뛴다 */
async function docRestoreFromDir(){
  if(!DOCS.dir){ toast("먼저 보관 폴더를 연결하세요."); return; }
  if(await docPerm(true)!=="granted"){ toast("폴더 읽기를 허용해야 되살릴 수 있어요."); return; }
  const ownerOf=id=>{ const t=(S.trials||[]).find(x=>x.id===id); return t&&t.memberId?t.memberId:id; };
  const have=new Set(DOCS.list.map(d=>ownerOf(d.memberId)+"|"+d.date+"|"+d.kind));
  let n=0,files=0; const miss=[];
  for await (const [name,h] of DOCS.dir.entries()){
    if(h.kind!=="directory")continue;
    const mm=name.match(/^(.*?)(?:_(\d{4}))?$/), nm=mm[1], p4=mm[2]||"";
    let cands=S.members.filter(x=>x.name===nm);
    if(p4&&cands.length>1)cands=cands.filter(x=>phone4(x)===p4);
    if(!cands.length){ cands=(S.trials||[]).filter(x=>x.name===nm&&!x.memberId); if(p4&&cands.length>1)cands=cands.filter(x=>phone4(x)===p4); }
    if(cands.length!==1){ miss.push(name); continue; }
    const m=cands[0], groups={}, pdfs=[];
    for await (const [fn,fh] of h.entries()){
      if(fh.kind!=="file")continue;
      const pm=fn.match(/^(\d{4}-\d{2}-\d{2})_(.+?)(?:_(\d+))?\.pdf$/i); if(pm){ pdfs.push({fn,date:pm[1],kind:pm[2],fh}); continue; }
      const x=fn.match(/^(\d{4}-\d{2}-\d{2})_(.+?)_(\d+)쪽\.jpe?g$/i); if(!x)continue;
      (groups[x[1]+"|"+x[2]]=groups[x[1]+"|"+x[2]]||[]).push({i:+x[3],fh});
    }
    for(const k in groups){
      const [date,kind]=k.split("|");
      if(have.has(m.id+"|"+date+"|"+kind))continue;
      const pages=[];
      for(const pg of groups[k].sort((a,b)=>a.i-b.i)){
        const f=await pg.fh.getFile();
        pages.push({blob:new Blob([await f.arrayBuffer()],{type:"image/jpeg"}),w:0,h:0}); files++;
      }
      const rec={id:uid("d"),memberId:m.id,member:m.name,date,kind,savedAt:new Date().toISOString(),pages};
      await docStorePut(rec); docListPut(rec); have.add(m.id+"|"+date+"|"+kind); n++;
    }
    const haveF=new Set(DOCS.list.filter(d=>d.pdf&&ownerOf(d.memberId)===m.id).map(d=>d.fname));
    for(const p of pdfs){
      if(haveF.has(p.fn))continue;
      const f=await p.fh.getFile(); files++;
      const rec={id:uid("d"),memberId:m.id,member:m.name,date:p.date,kind:p.kind,savedAt:new Date().toISOString(),pdf:true,fname:p.fn,
        pages:[{blob:new Blob([await f.arrayBuffer()],{type:"application/pdf"}),pdf:true}]};
      await docStorePut(rec); docListPut(rec); haveF.add(p.fn); n++;
    }
  }
  logAct("폴더에서 자료 되살림",n+"묶음 · "+files+"장"+(miss.length?" · 못 찾은 폴더 "+miss.length:""));
  save(); render();
  toast(n?n+"묶음("+files+"장)을 되살렸어요."+(miss.length?" 회원을 못 찾은 폴더: "+miss.slice(0,3).join(", ")+(miss.length>3?" 외":""):""):
    (miss.length?"회원을 못 찾은 폴더만 있어요: "+miss.slice(0,3).join(", "):"되살릴 새 자료가 없어요."));
}

/* 같은 자료가 두 번 들어가지 않게 (서버 실시간 알림이 먼저 도착할 수 있다) */
function docListPut(rec){ const i=DOCS.list.findIndex(x=>x.id===rec.id); if(i>=0)DOCS.list[i]=rec; else DOCS.list.push(rec); }
/* ── 저장·지우기 ── */
async function docSave(m){
  if(!DP.pages.length)return;
  if(!DOCS.db){ toast("이 브라우저에서는 자료를 저장할 수 없어요."); return; }
  let folderOk=false;
  if(DOCS.dir){ try{ folderOk=(await docPerm(true))==="granted"; }catch(e){} }
  const base={memberId:m.id,member:m.name,date:DP.date||TODAY(),kind:DP.kind,
    savedAt:new Date().toISOString(),by:S.me?(byId(S.staff,S.me)||{}).name:""};
  const imgs=DP.pages.filter(p=>!p.pdf), pdfs=DP.pages.filter(p=>p.pdf), recs=[];
  if(imgs.length)recs.push(Object.assign({id:uid("d")},base,{pages:imgs.map(p=>({blob:p.blob,w:p.w,h:p.h}))}));
  pdfs.forEach(p=>recs.push(Object.assign({id:uid("d")},base,{pdf:true,pages:[{blob:p.blob,pdf:true}]})));
  let where="";
  for(const rec of recs){
    if(rec.pdf)rec.fname=docPdfName(m,rec);
    try{ await docStorePut(rec); }catch(e){ toast("저장하지 못했어요: "+e.message); return; }
    docListPut(rec);
    if(folderOk){ try{ where=" · 폴더 "+(await docWriteFolder(m,rec)); }catch(e){ where=" · 폴더 사본 실패"; } }
  }
  DP.pages.forEach(p=>URL.revokeObjectURL(p.url)); DP.pages=[]; DV.add=false; DV.pane=true; DV.open=true;
  DV.id=recs[0].id; DV.page=0;
  recs.forEach(rec=>logAct("자료 추가",m.name+" · "+rec.date+" · "+rec.kind+" · "+(rec.pdf?"PDF":rec.pages.length+"쪽")+where));
  save(); render();
  toast(!DOCS.dir?"저장했어요. 설정 → 데이터에서 보관 폴더를 연결하면 원본 사본도 남아요.":
        (folderOk?"저장했어요. 보관 폴더에도 사본을 남겼어요.":"저장했어요. 폴더를 허용하지 않아 사본은 못 남겼어요."));
}
async function docDelete(id){
  const d=DOCS.list.find(x=>x.id===id); if(!d)return;
  if(!confirm(d.date+" "+d.kind+"("+d.pages.length+"쪽)를 지울까요?\n보관 폴더의 사본은 남습니다."))return;
  try{ await docStoreDel(id); }catch(e){ toast("지우지 못했어요."); return; }
  DOCS.list=DOCS.list.filter(x=>x.id!==id);
  for(let p=0;p<d.pages.length;p++){ const k=id+":"+p; if(DURL.has(k)){ URL.revokeObjectURL(DURL.get(k)); DURL.delete(k); } }
  if(DV.id===id){ DV.id=null; DV.page=0; DV.open=true; }
  logAct("자료 지움",d.member+" · "+d.date+" · "+d.kind); save(); render(); toast("지웠어요. 보관 폴더 사본은 그대로예요.");
}

/* ── 화면 ── */
function docCurrent(m){
  const list=docsOf(m); if(!list.length)return null;
  let d=list.find(x=>x.id===DV.id)||list[0];
  if(DV.id!==d.id){ DV.id=d.id; DV.page=0; }
  if(DV.page>=d.pages.length)DV.page=d.pages.length-1;

/* 인쇄·PDF — 쪽마다 A4 한 장. 인쇄 창에서 ‘PDF로 저장’을 고르면 PDF가 된다(미리 만들어 두는 파일은 없음) */
function docPrint(d){
  if(!d||d.pdf)return;
  let box=$("printbox"); if(!box){ box=document.createElement("div"); box.id="printbox"; document.body.appendChild(box); }
  box.innerHTML=d.pages.map((p,i)=>'<div class="prpg"><img src="'+docURL(d,i)+'" alt=""></div>').join("");
  const ims=[...box.querySelectorAll("img")];
  Promise.all(ims.map(im=>im.complete?1:new Promise(r=>{ im.onload=im.onerror=r; }))).then(()=>{
    document.body.classList.add("printing");
    const done=()=>{ document.body.classList.remove("printing"); box.innerHTML=""; window.removeEventListener("afterprint",done); };
    window.addEventListener("afterprint",done);
    window.print();
  });
}
function docMove(step){
  const m=S.openId?byId(S.members,S.openId):null; if(!m)return;
  const d=docCurrent(m); if(!d)return;
  const np=DV.page+step;
  if(np>=0&&np<d.pages.length){ DV.page=np; paintDocs(); paintDocFull(); }
}
/* 버튼 처리 — 기존 클릭 처리기에서 먼저 넘겨받는다. 처리했으면 true */
function docAction(a,v,t){
  const m=S.openId?byId(S.members,S.openId):null;
  if(a==="docdir"){ if(HOSTED)return true; docPickDir(); return true; }
  if(a==="docrestore"){ docRestoreFromDir(); return true; }
  if(!m)return false;

  if(a==="docsave"){ docSave(m); return true; }
  if(a==="docdel"){ docDelete(v); return true; }
  if(a==="docfirst"){ docReorder(m,v,0); return true; }
  if(a==="docrekind"){ const d=DOCS.list.find(x=>x.id===v); if(d)docRedate(v,d.date,DOC_KINDS[(DOC_KINDS.indexOf(d.kind)+1)%DOC_KINDS.length]); return true; }

}

function trialGiveStaff(t,m){

function parseBirth(v){
  if(v instanceof Date&&!isNaN(v))return D(v);
  if(typeof v==="number"&&v>1000&&v<80000)return D(new Date(Math.round((v-25569)*86400000)+new Date().getTimezoneOffset()*60000));
  v=String(v||"").trim(); if(!v)return "";
  /* 주민등록번호가 들어오면 앞 6자리와 성별 자리로 생년월일만 만들고 나머지는 버린다 */
  const rn=v.replace(/\s/g,"").match(/^(\d{6})-?([0-9])\d{6}$/);
  if(rn){ const c={1:"19",2:"19",5:"19",6:"19",3:"20",4:"20",7:"20",8:"20",9:"18",0:"18"}[rn[2]];
    v=c+rn[1]; }
  let y,m,d; const n=v.match(/\d+/g)||[];
  if(n.length>=3){ [y,m,d]=n; }
  else{ const g=digits(v);
    if(g.length===8){ y=g.slice(0,4); m=g.slice(4,6); d=g.slice(6); }
    else if(g.length===6){ y=g.slice(0,2); m=g.slice(2,4); d=g.slice(4); }
    else return null; }
  y=+y; m=+m; d=+d;
  if(y<100){ const cy=new Date().getFullYear()%100; y+=(y>cy?1900:2000); }
  const dt=new Date(y,m-1,d);
  if(!(y>1900&&dt.getMonth()===m-1&&dt.getDate()===d&&dt<=new Date()))return null;
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function ageOf(b){ if(!b)return ""; const [y,m,d]=b.split("-").map(Number), t=new Date();
  let a=t.getFullYear()-y; if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<d))a--; return "만 "+a+"세"; }
function trialAutoLink(){
  let n=0;
  (S.trials||[]).forEach(t=>{

    t.memberId=null;

    const hits=S.members.filter(m=>digits(m.phone)===ph&&(t.no||[]).indexOf(m.id)<0);
    if(hits.length===1&&nameKey(hits[0].name)===nameKey(t.name)){ t.memberId=hits[0].id; t.linkedAt=TODAY(); trialGiveStaff(t,hits[0]); if(t.sign)memPrioInit(hits[0]); n++; }

  return n;
}

/* 순위 줄 — 번호마다 그림 위 위치(부위)와 설명 */
function trPrioRows(t){
  const b=trB(t), out=[];
  for(let n=1;n<=TR_N;n++){
    const p=(b.pins||[]).find(x=>x.n===n), tx=String(((t.ptext||{})[n])||"").trim();
    if(p||tx)out.push({n,p,r:p?(p.r||trNameAt(b,p.v,p.x,p.y)):"",tx});
  }
  return out;
}
const trPrioText=x=>(x.r||"")+(x.r&&x.tx?" — ":"")+x.tx;
function trDotNames(t){
  const b=trB(t), c={}, ord=[];
  (b.dots||[]).forEach(d=>{ const k=d.r||trNameAt(b,d.v,d.x,d.y); if(!c[k]){ c[k]=0; ord.push(k); } c[k]++; });
  return ord.map(k=>c[k]>1?k+" ×"+c[k]:k);
}
/* 내용 지문 — 서명하는 중에 바뀌면 서명을 지운다 */
function trHash(t){ const b=trB(t); return JSON.stringify([t.name,t.date,t.memo||"",t.ptext||{},b.g,b.pins||[],b.dots||[]]); }
const trEmpty=t=>!String(t.name||"").trim()&&!String(t.memo||"").trim()&&!trPrioRows(t).length&&!(trB(t).dots||[]).length&&!t.sign;

/* 상담 내용 한 덩어리 (미리보기·상세·동의서가 같이 쓴다). 옛 기록의 운동·수면·식사도 그대로 보여준다 */
function trialLines(src){
  const out=[];
  const pr=trPrioRows(src); if(pr.length)out.push(["해결하고 싶은 것",pr.map(x=>x.n+". "+trPrioText(x)).join("\n")]);
  const dn=trDotNames(src); if(dn.length)out.push(["불편한 곳",dn.join(", ")]);
  TRIAL_Q.forEach(([k,lab])=>{ const v=String((src.q||{})[k]||"").trim(); if(v)out.push([lab,v]); });
  const m=String(src.memo||"").trim(); if(m)out.push([src.body?"상담 메모":"기타",m]);
  return out;
}
function trialPreviewHtml(src){
  const l=trialLines(src);
  return l.length?l.map(([k,v])=>'<div class="tcl"><i>'+k+'</i><span>'+esc(v)+'</span></div>').join("")
    :'<div class="tpnone">아직 적은 상담 내용이 없어요.</div>';
}

/* ── 신체 그림 칸 (컴퓨터·태블릿 같이) ── */
function trFigHtml(t,big){
  const b=trB(t), lock=!!t.sign||S.ro, placed=new Set((b.pins||[]).map(p=>p.n));
  let h='<div class="trfig'+(lock?" lock":"")+(big?" big":"")+'" data-t="'+t.id+'">'+
    '<div class="trtop"><div class="seg trseg">'+[["f","여성"],["m","남성"]].map(([k,l])=>
      '<button class="'+(b.g===k?"on":"")+'" data-a="trg" data-v="'+k+'" data-t="'+t.id+'"'+(lock?" disabled":"")+'>'+l+'</button>').join("")+'</div>'+
    '<span class="trhint">'+(lock?'서명한 그림이에요':'불편한 곳을 누르면 점 · 다시 누르면 지움 · 번호는 끌어다 놓기')+'</span></div>'+
    '<div class="trbox"><div class="trtray">'+[1,2,3,4,5].map(n=>'<div class="trtok'+(placed.has(n)?" used":"")+'" data-n="'+n+'">'+n+'</div>').join("")+'<i>순위</i></div>'+
    '<div class="trfigs">'+["front","back"].map(v=>'<div class="trf">'+trSvg(b,v,b,big)+
      '<div class="lr">'+(trIs2(b)?'<span></span><b>'+(v==="front"?"앞":"뒤")+'</b><span></span>'
        :'<span>'+(v==="front"?"오른쪽":"왼쪽")+'</span><b>'+(v==="front"?"앞":"뒤")+'</b><span>'+(v==="front"?"왼쪽":"오른쪽")+'</span>')+'</div></div>').join("")+'</div></div>';
  const ed=!big&&!lock;                                   /* 이름 고치기는 선생님 입력 화면에서만 */
  const dn=(b.dots||[]).map((d,i)=>({i,d,r:d.r||trNameAt(b,d.v,d.x,d.y)}));
  h+='<div class="trchips">'+(dn.length?dn.map(x=>'<span class="trchip">'+(ed?'<button class="trcn" data-a="trdotname" data-t="'+t.id+'" data-w="'+x.d.v+'" data-x="'+x.d.x+'" data-y="'+x.d.y+'" title="눌러서 이름 고치기">'+esc(x.r)+'</button>':esc(x.r))+(lock?'':'<button data-a="trdotdel" data-v="'+x.i+'" data-t="'+t.id+'">×</button>')+'</span>').join("")
     :'<span class="trnone">아직 표시한 곳이 없어요</span>')+'</div></div>';
  return h;
}
/* 그림 좌표 */
function trSvgPt(svg,e){ const m=svg.getScreenCTM(); if(!m)return {x:0,y:0}; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); return {x:p.x,y:p.y}; }
function trInside(svg,pt){
  const P=new DOMPoint(pt.x,pt.y);
  if(svg.classList.contains("bf2"))return !!bf2Idx(svg.dataset.g,svg.dataset.v,pt.x,pt.y);
  return Array.from(svg.querySelectorAll(".bfs")).some(el=>{ try{ return el.isPointInFill(P)||el.isPointInStroke(P); }catch(e){ return true; } });
}
/* 끌기·누르기 — 마우스와 손가락 둘 다(pointer) */
const TRD={cur:null,tap:null};
function trGhost(e){ const g=TRD.cur&&TRD.cur.gh; if(g){ g.style.left=(e.clientX-17)+"px"; g.style.top=(e.clientY-17)+"px"; } }
document.addEventListener("pointerdown",e=>{
  const fig=e.target.closest&&e.target.closest(".trfig"); if(!fig||fig.classList.contains("lock"))return;
  const tok=e.target.closest(".trtok"), pin=e.target.closest(".bfpin"), svg=e.target.closest("svg.bf");
  if(tok||pin){
    e.preventDefault();
    const n=+(tok?tok.dataset.n:pin.dataset.n), gh=document.createElement("div");
    gh.className="trghost"; gh.textContent=n; document.body.appendChild(gh);
    TRD.cur={id:fig.dataset.t,n,gh,pin}; trGhost(e);
    if(pin)pin.style.opacity=".25";
    try{ (tok||fig).setPointerCapture&&fig.setPointerCapture(e.pointerId); }catch(x){}
    return;
  }
  if(svg){ TRD.tap={id:fig.dataset.t,svg,x0:e.clientX,y0:e.clientY}; }
},{passive:false});
document.addEventListener("pointermove",e=>{ if(TRD.cur){ e.preventDefault(); trGhost(e); } },{passive:false});
document.addEventListener("pointercancel",()=>{ if(TRD.cur){ TRD.cur.gh.remove(); if(TRD.cur.pin)TRD.cur.pin.style.opacity=""; TRD.cur=null; } TRD.tap=null; });
document.addEventListener("pointerup",e=>{
  if(TRD.cur){
    const c=TRD.cur; TRD.cur=null; c.gh.remove(); if(c.pin)c.pin.style.opacity="";
    const t=trFind(c.id); if(!t||t.sign)return;
    const el=document.elementFromPoint(e.clientX,e.clientY), svg=el&&el.closest&&el.closest(".trfig[data-t='"+c.id+"'] svg.bf");
    const b=trBody(t), old=(b.pins||[]).find(p=>p.n===c.n);
    if(svg){
      const pt=trSvgPt(svg,e), v=svg.dataset.v;
      if(!trInside(svg,pt)){ if(!old)toast("몸 그림 위에 놓아 주세요."); trRepaint(t); return; }
      b.pins=(b.pins||[]).filter(p=>p.n!==c.n);
      b.pins.push({n:c.n,v,x:Math.round(pt.x),y:Math.round(pt.y),r:trNameAt(b,v,pt.x,pt.y)});   /* 옮기면 새 자리 이름(고친 이름은 지움) */
    }else{
      if(!old){ trRepaint(t); return; }
      b.pins=(b.pins||[]).filter(p=>p.n!==c.n);          /* 그림 밖에 놓으면 그 번호를 뺀다 */
    }
    trBump(t,"b"); trChanged(t); return;
  }
  if(TRD.tap){
    const c=TRD.tap; TRD.tap=null;
    if(Math.hypot(e.clientX-c.x0,e.clientY-c.y0)>10)return;
    const t=trFind(c.id); if(!t||t.sign)return;
    const pt=trSvgPt(c.svg,e), v=c.svg.dataset.v, b=trBody(t);
    const i=(b.dots||[]).findIndex(d=>d.v===v&&Math.hypot(d.x-pt.x,d.y-pt.y)<(trIs2(b)?20:10));
    if(i>=0)b.dots.splice(i,1);
    else{ if(!trInside(c.svg,pt))return; (b.dots=b.dots||[]).push({v,x:Math.round(pt.x),y:Math.round(pt.y),r:trNameAt(b,v,pt.x,pt.y)}); }
    trBump(t,"b"); trChanged(t);
  }
});

/* ── 바뀌었을 때: 저장 + 지금 열린 칸만 다시 그리기(쓰고 있는 칸은 건드리지 않는다) ── */
let trSaveT=null;
function trChanged(t,soon){
  t.updAt=new Date().toISOString();
  clearTimeout(trSaveT);
  const go=()=>{ trialAutoLink(); save(); };
  if(soon)trSaveT=setTimeout(go,500); else go();
  trRepaint(t);
}
function trRepaint(t){
  if(!t)return;
  document.querySelectorAll(".trfig[data-t='"+t.id+"']").forEach(el=>{ const ae=document.activeElement; if(ae&&ae.tagName==="INPUT"&&el.contains(ae))return; el.outerHTML=trFigHtml(t,el.classList.contains("big")); });
  const pr=$("trprio"); if(pr&&TD&&TD.id===t.id&&!pr.contains(document.activeElement))pr.innerHTML=trPrioEditHtml(t);
  const st=$("trstat"); if(st&&TD&&TD.id===t.id)st.innerHTML=trStatHtml(t);
  const tl=$("triallist"); if(tl&&!tl.contains(document.activeElement))tl.innerHTML=trialListHtml();
  if(S.signId===t.id)paintSign(true);
  else if(S.signList)paintSign();
}

/* ── 컴퓨터 양식 ── */
function trStatHtml(t){
  if(t.sign)return '<span class="pill">서명 완료'+(t.sign.no?' · '+esc(t.sign.no):'')+'</span>';
  const tab=trB(t).tab, live=tab&&Date.now()-new Date(tab).getTime()<20*60000;
  return (live?'<span class="pill"><i></i>태블릿에서 보는 중 · 서명 대기</span>':'<span class="pill o">서명 대기</span>')+
    '<span class="trsaved">자동 저장됨 '+(t.updAt?esc(new Date(t.updAt).toTimeString().slice(0,8)):"")+'</span>';
}
function trPrioEditHtml(t){
  const b=trB(t), lock=!!t.sign||S.ro;
  let h="";
  for(let n=1;n<=TR_N;n++){
    const p=(b.pins||[]).find(x=>x.n===n), tx=((t.ptext||{})[n])||"";
    const r=p?(p.r!=null&&(p.e||p.r)?p.r:trNameAt(b,p.v,p.x,p.y)):"";
    h+='<div class="trpr'+(p||tx?"":" empty")+'"><span class="n">'+n+'</span>'+
      (p&&!lock?'<input class="trrn" data-a="prn" data-n="'+n+'" value="'+esc(r)+'" placeholder="부위 이름" title="부위 이름 — 고칠 수 있어요(비우면 예상 이름으로)">'
        :'<span class="r">'+(r?esc(r):'<i>그림에 놓으면 부위가 들어와요</i>')+'</span>')+
      (lock?'<span class="tx">'+esc(tx)+'</span>'
           :'<input data-a="pt" data-n="'+n+'" value="'+esc(tx)+'" placeholder="'+(n===1?'어떻게 불편한지 (예: 오래 앉으면 뻐근 · 매일)':'어떻게 불편한지')+'">')+'</div>';
  }
  return h;
}

    '<div class="tgrid">'+
      '<label>이름'+(locked?ro(t.name):inp("name","필수"))+'</label>'+
      '<label>전화번호'+inp("phone","등록하면 이 번호로 연결돼요",' inputmode="tel"')+'</label>'+
      '<label>생년월일'+(locked?ro(t.birth):inp("birth","예: 19650312",' inputmode="numeric"'))+'</label>'+
      '<label>체험한 날'+(locked?ro(t.date):'<input type="date" data-a="tf" data-k="date" value="'+esc(t.date||"")+'" max="'+esc(TODAY())+'">')+'</label>'+
      '<label>담당<select data-a="tf" data-k="staffId"><option value="">선택</option>'+
        act.map(s=>'<option value="'+s.id+'"'+(t.staffId===s.id?" selected":"")+'>'+esc(s.name)+'</option>').join("")+'</select></label>'+

    '</div>'+
    '<div class="trrow"><div class="trcol"><div class="trh">불편한 곳 <span>태블릿에서 누른 자리가 그대로 보여요 · 아래 이름을 누르면 고쳐요</span></div>'+trFigHtml(t,false)+'</div>'+
    '<div class="trcol"><div class="trh">해결하고 싶은 것 <span>순위는 그림에 번호를 끌어다 놓아 정해요 · 부위 이름과 설명은 여기서 고쳐요</span></div><div id="trprio" class="trprio">'+trPrioEditHtml(t)+'</div>'+
      '<div class="trh" style="margin-top:14px">상담 메모 <span>회원 태블릿에 그대로 보이고, 서명하면 동의서에 들어가요</span></div>'+
      (locked?'<div class="trmemo ro">'+esc(t.memo||"(적은 내용 없음)")+'</div>'
        :'<textarea class="grow trmemo" rows="4" data-a="tf" data-k="memo" placeholder="아픈 곳, 병력, 복용 약, 온 이유, 원하는 것 등 — 회원이 보고 확인합니다">'+esc(t.memo||"")+'</textarea>')+
      ((t.q&&Object.keys(t.q).length)?'<div class="trold"><b>예전 양식에 적은 것</b>'+TRIAL_Q.map(([k,lab])=>t.q[k]?'<div><i>'+lab+'</i> '+esc(t.q[k])+'</div>':'').join("")+'</div>':'')+
    '</div></div>';
  if(locked){
    h+='<div class="tsign"><div class="tpadw">'+(signDoc
      ?'<div class="tsigned"><img src="'+docURL(signDoc,0)+'" alt="체험동의서" data-a="trialsignview" data-v="'+signDoc.id+'"><span>서명 완료 · '+esc(when)+(t.sign.dev==="tab"?' · 태블릿':'')+' · 누르면 크게</span></div>'
      :'<div class="tsigned"><span>서명 완료 · '+esc(when)+' (동의서 그림을 아직 못 받았어요 — 잠시 뒤 다시 열어 보세요)</span></div>')+'</div>'+
      '<div class="tadds"><b>추가 메모</b>'+
      ((t.adds||[]).length?(t.adds||[]).map(x=>'<div class="tcl"><i>'+esc(x.d.slice(5).replace("-","/"))+'</i><span>'+esc(x.text)+(x.by?' <em>— '+esc(x.by)+'</em>':'')+'</span></div>').join(""):'')+
      '<textarea class="grow" rows="2" data-a="tfadd" placeholder="서명 뒤에 새로 들은 것 (오늘 날짜로 붙어요)">'+esc(TD.add||"")+'</textarea>'+
      '<div><button class="btn sm navy" data-a="trialaddsave">추가 메모 남기기</button></div></div></div>';
  }else{
    h+='<div class="trsignbar"><div><b>서명</b> 태블릿에서 <u>주소 끝에 #상담</u>을 붙인 화면을 열고 이 회원 이름을 누르면 돼요.</div><span class="sp"></span>'+

  }
  h+='<div class="tfoot"><button class="btn gh" data-a="trialdel" style="color:var(--red)">이 기록 지우기</button></div></div></div>';
  return h;

/* 상세 서랍 안 '체험 상담' 칸 */

  const tl=trialsOf(m); if(!tl.length)return "";

}

/* ── 글 칸 입력 ── */
function trInput(el){
  const t=trFind(TD&&TD.id); if(!t||S.ro)return;
  const a=el.dataset.a;
  if(a==="tfadd"){ TD.add=el.value; return; }
  if(a==="prn"){ if(t.sign)return; const p=(trBody(t).pins||[]).find(x=>x.n===+el.dataset.n); if(!p)return; p.r=el.value; p.e=1; trBump(t,"b"); trChanged(t,true); return; }
  if(t.sign&&a==="tf"&&["phone","staffId","addr"].indexOf(el.dataset.k)<0)return;
  if(a==="pt"){ if(t.sign)return; t.ptext=Object.assign({},t.ptext||{}); const n=el.dataset.n, v=el.value; if(v.trim())t.ptext[n]=v; else delete t.ptext[n]; }
  else{
    const k=el.dataset.k, v=el.value;
    if(k==="phone")t.phone=digits(v);
    else if(k==="birth"){ t.birthIn=v; const b=parseBirth(v); t.birth=b||""; el.classList.toggle("bad",!!v.trim()&&b===null); }
    else if(k==="date")t.date=v&&v<=TODAY()?v:TODAY();
    else if(k==="name")t.name=normName(v)?v.trim():"";
    else t[k]=v;
  }
  trBump(t,"t"); trChanged(t,true);
}

/* ── 열기·닫기·지우기 ── */
function trialOpen(t){
  if(!t){
    S.trials=S.trials||[];
    t={id:uid("t"),createdAt:new Date().toISOString(),by:S.me?(byId(S.staff,S.me)||{}).name||"":"",
       name:"",phone:"",birth:"",addr:"",date:TODAY(),staffId:S.me||"",memo:"",ptext:{},body:{g:"f",fig:2,dots:[],pins:[],rev:1},trev:1};
    S.trials.push(t); save();
  }
  trFig2Up(t);
  TD={id:t.id,add:""};
  render(); window.scrollTo(0,0);
}
function trFig2Up(t){
  const b=t&&t.body; if(!b||t.sign||b.fig===2||(b.dots||[]).length||(b.pins||[]).length)return;
  b.fig=2; trBump(t,"b"); save();
}

/* 덮개 그리기. soft=true면 서명 칸은 그대로 두고 나머지만 새로 */
function paintSign(soft){
  let el=$("signv");
  if(CONSULT){
    if(!S.signId)S.signList=true;
    if(!sgReady()){ if(el)el.classList.remove("on"); return; }
  }
  if(!S.signId&&!S.signList){ if(el){ el.classList.remove("on"); el.innerHTML=""; } document.body.classList.remove("signing"); return; }
  if(!el){ el=document.createElement("div"); el.id="signv"; el.className="signv"; document.body.appendChild(el); }
  el.classList.add("on"); document.body.classList.add("signing");
  if(S.signList&&!S.signId){ el.innerHTML=sgListHtml(); return; }
  const t=trFind(S.signId); if(!t){ S.signId=null; el.innerHTML=sgListHtml(); return; }
  if(soft&&$("sgpad")&&!t.sign){
    /* 내용이 바뀌었으면 서명을 지운다 — 바뀐 내용에 서명받아야 하니까 */
    if(SG.hash&&SG.sig.length&&trHash(t)!==SG.hash){ SG.sig=[]; SG.hash=null; sgPadInit(); sgMsg("내용이 바뀌었어요. 다시 확인하고 서명해 주세요."); }

function sgMsg(s){ const m=$("sgmsg"); if(m){ m.textContent=s; m.style.display=s?"block":"none"; } }
function sgPadInit(){
  const c=$("sgpad"); if(!c)return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const g=c.getContext("2d"); g.scale(dpr,dpr);
  const W=r.width,H=r.height;
  const style=()=>{ g.lineWidth=2.6; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#111"; };
  const draw=()=>{ g.clearRect(0,0,W,H); style();
    SG.sig.forEach(s=>{ g.beginPath(); s.forEach(([x,y],i)=>i?g.lineTo(x*W,y*H):g.moveTo(x*W,y*H)); if(s.length===1)g.lineTo(s[0][0]*W+.5,s[0][1]*H); g.stroke(); }); };
  draw();
  let cur=null;
  const pt=e=>{ const b=c.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))]; };
  c.onpointerdown=e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); const t=trFind(S.signId); if(!SG.sig.length&&t)SG.hash=trHash(t); sgMsg("");
    cur=[pt(e)]; SG.sig.push(cur); draw(); };
  c.onpointermove=e=>{ if(!cur)return; cur.push(pt(e)); const n=cur.length; style(); g.beginPath();
    g.moveTo(cur[n-2][0]*W,cur[n-2][1]*H); g.lineTo(cur[n-1][0]*W,cur[n-1][1]*H); g.stroke(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
}
async function sgDone(){
  const t=trFind(S.signId); if(!t||t.sign)return;
  if(!String(t.name||"").trim()){ sgMsg("선생님이 이름을 아직 안 적었어요. 이름이 들어간 뒤 서명해 주세요."); return; }
  if(!SG.chk.sens||!SG.chk.ok){ sgMsg("두 가지 동의에 체크해 주세요."); return; }
  if(!SG.sig.length){ sgMsg("서명 칸에 서명해 주세요."); return; }
  if(SG.hash&&trHash(t)!==SG.hash){ SG.sig=[]; SG.hash=null; sgPadInit(); sgMsg("내용이 바뀌었어요. 다시 확인하고 서명해 주세요."); return; }
  if(!DOCS.db){ sgMsg("이 브라우저에서는 서명을 저장할 수 없어요. 크롬으로 열어 주세요."); return; }
  const btn=document.querySelector("[data-a=sgdone]"); if(btn){ btn.disabled=true; btn.textContent="저장하는 중…"; }
  try{
    const who=S.me?(byId(S.staff,S.me)||{}).name||"":"";
    const at=new Date().toISOString(), no=trSignNo(at);
    const pages=await trialSignImage(t,SG.sig,no,at);

    t.sign={at,no,text:TRIAL_TERMS,docId:rec.id,sens:true,dev:(S.signDev||(window.matchMedia("(pointer:coarse)").matches?"tab":"pc")),by:who};
    trBody(t).tab=null; trBump(t,"b");
    if(!t.birth&&t.birthIn)t.birth=parseBirth(t.birthIn)||"";
    const linked=trialAutoLink(); const m=trialMember(t); if(m)memPrioInit(m,true);
    logAct("체험 서명",t.name+" · "+t.date);
    save(); SG.sig=[]; paintSign(); render();
    if(CONSULT){ const id=t.id; setTimeout(()=>{ if(S.signId===id){ S.signId=null; S.signList=true; paintSign(); } },6000); }
    else toast(m?"서명했어요. "+m.name+" 회원에게 연결했어요.":"서명했어요.");
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="서명 완료"; } sgMsg("서명을 저장하지 못했어요: "+(e.message||e)); }

/* ── 동의서 그림: 정보 + 신체 그림 + 순위 + 메모 + 동의 문구 + 서명 ── */
function bfSvgFile(g,marks){
  const st='<style>.bfs{fill:#fff;stroke:#6b737d;stroke-width:1.4;stroke-linejoin:round}.bfl{fill:none;stroke:#aab0b8;stroke-width:1.1;stroke-linecap:round}.bfh{fill:#eceef1;stroke:#6b737d;stroke-width:1.2}'+
    '.bfdot{fill:#c33a2e;fill-opacity:.85;stroke:#fff;stroke-width:1.5}.bfpin circle{fill:#1c3557;stroke:#fff;stroke-width:2}.bfpin text{fill:#fff;font:800 12px sans-serif;text-anchor:middle}</style>';
  const one=v=>bfSvg(g,v,marks,{}).replace('<svg class="bf"','<svg x="'+(v==="front"?0:260)+'" width="240" height="560"').replace(/ data-v="[a-z]+"/,"");
  return '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="560" viewBox="0 0 500 560">'+st+one("front")+one("back")+'</svg>';
}
/* ── 체험 상담 확인서 (v128) — A4 쪽 단위. 시안 기준 794×1123 좌표로 그리고 2배로 찍는다.
   1쪽: 머리·회원 정보·01 불편한 곳과 순위·02 상담 메모. 메모가 넘치면 다음 쪽으로 이어지고,
   03 확인 및 동의 + 서명은 한 덩어리로 마지막 쪽에 둔다(서명은 쪽 아래). 쪽마다 아래 쪽 번호. ── */
function trSignNo(at){
  const d=new Date(at), ymd=String(d.getFullYear()).slice(2)+pad2(d.getMonth()+1)+pad2(d.getDate());
  const used=new Set((S.trials||[]).map(x=>x.sign&&x.sign.no).filter(Boolean));
  let n=1; while(used.has("T-"+ymd+"-"+pad2(n)))n++;
  return "T-"+ymd+"-"+pad2(n);
}
function trDocImgs(b){
  if(trIs2(b))return Promise.all(["front","back"].map(v=>new Promise(ok=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>ok(null); im.src=bf2Url(b.g,v); })))
    .then(([f,k])=>f&&k?{front:f,back:k}:null);
  return new Promise(ok=>{ const im=new Image(); im.onload=()=>ok({old:im}); im.onerror=()=>ok(null);
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(bfSvgFile(b.g,b)); });
}
function trialSignImage(t,strokes,no,at){
  const b=trB(t);
  return trDocImgs(b).then(imgs=>{
    const PW=794, PH=1123, K=2, L=52, R=PW-52, CW=R-L, TOP=46, FOOT=PH-34;
    const FONT='"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif';
    const C={ink:"#1c2533",navy:"#1c3557",mut:"#5d6673",fnt:"#9097a1",line:"#e3e6ea",soft:"#f5f6f8",red:"#c33a2e",chip:"#fbeceb"};
    const meas=document.createElement("canvas").getContext("2d");
    const F=(px,w)=>(w||400)+" "+px+"px "+FONT;
    const wrap=(text,px,w,maxW)=>{ meas.font=F(px,w); const out=[];
      String(text==null?"":text).split("\n").forEach(par=>{ let line="";
        for(const ch of par){ if(meas.measureText(line+ch).width>maxW&&line){ out.push(line); line=ch.trim()?ch:""; } else line+=ch; }
        out.push(line); });
      return out; };
    const fit=(text,px,w,maxW)=>{ meas.font=F(px,w); let s=String(text||"-"); if(meas.measureText(s).width<=maxW)return s;
      while(s.length>1&&meas.measureText(s+"…").width>maxW)s=s.slice(0,-1); return s+"…"; };
    const dt=s=>{ const m=String(s||"").match(/^(\d{4})-(\d\d)-(\d\d)/); return m?m[1]+". "+m[2]+". "+m[3]:String(s||"-"); };
    const dtw=s=>{ const m=String(s||"").match(/^(\d{4})-(\d\d)-(\d\d)/); if(!m)return dt(s); const d=new Date(+m[1],+m[2]-1,+m[3]); return dt(s)+" ("+WD[d.getDay()]+")"; };
    const sat=new Date(at||Date.now()), signed=sat.getFullYear()+". "+pad2(sat.getMonth()+1)+". "+pad2(sat.getDate())+" "+pad2(sat.getHours())+":"+pad2(sat.getMinutes());
    const bir=t.birth?dt(t.birth):(t.birthIn||"-");
    /* 내용 준비 */
    const pr=trPrioRows(t), dots=trDotNames(t).map(s=>s||"이름 없는 곳");
    const prW=CW-330-22-36;
    const prRows=pr.map(x=>({n:x.n,title:x.r||"부위 표시 없음",desc:x.tx?wrap(x.tx,10.5,400,prW):[]}));
    const memoLines=String(t.memo||"").trim()?wrap(String(t.memo).trim(),11.5,400,CW-30):null;
    const terms=String(TRIAL_TERMS).split("\n").map(p=>wrap(p,9.6,400,CW-23-2-24));
    const ck1=wrap("상담에 필요한 건강 정보(불편한 곳, 병력, 복용 약)를 수집·이용하는 데 동의합니다.",11.5,600,CW-23);
    const ck2=wrap("위 상담 내용을 확인하였으며, 동의합니다.",11.5,600,CW-23);
    /* 높이 */
    const prH=prRows.reduce((a,x,i)=>a+(i?10:2)+16+x.desc.length*15.5+10+1,0);
    meas.font=F(10.5);
    const chipW=dots.map(s=>Math.ceil(meas.measureText(s).width)+7+7+5+9);
    let cx=0, crow=dots.length?1:0; chipW.forEach(w=>{ if(cx+w>CW-352&&cx>0){ crow++; cx=0; } cx+=w+4; });
    const etcH=dots.length?12+14+crow*25:0;
    const rightH=(pr.length?prH:22)+etcH;

/* ===================== 회원 상세 — 해결하고 싶은 것 =====================

function memPrioInit(m,force){
  if(Array.isArray(m.prio)&&!force)return m.prio;
  if(Array.isArray(m.prio)&&m.prio.length)return m.prio;
  const tr=trialsOf(m).filter(t=>t.sign).concat(trialsOf(m).filter(t=>!t.sign))[0];
  const rows=tr?trPrioRows(tr):[];
  if(!rows.length)return Array.isArray(m.prio)?m.prio:null;
  m.prio=rows.map(x=>({id:uid("p"),t:trPrioText(x),at:tr.date,by:"체험"}));
  return m.prio;
}
function memPrioHtml(m){
  const l=Array.isArray(m.prio)?m.prio:[];
  const on=l.filter(x=>!x.done), off=l.filter(x=>x.done);
  let h='<div><div class="dsec">해결하고 싶은 것 <span class="dsub">'+(S.ro?'':'끌어서 순서 · 해결되면 ✓')+'</span></div><div class="mprio" data-v="'+m.id+'">';
  if(!l.length)h+='<div class="mpnone">'+(trialsOf(m).length?'체험에서 정한 순위가 없어요.':'아직 없어요.')+(S.ro?'':' 아래에 적어 넣으세요.')+'</div>';
  on.forEach((x,i)=>{ h+='<div class="mpr" data-id="'+x.id+'">'+(S.ro?'':'<span class="mph" title="끌어서 순서 바꾸기">⋮⋮</span>')+'<span class="n">'+(i+1)+'</span>'+
    '<span class="t">'+esc(x.t)+'</span>'+(S.ro?'':'<button class="mpd" data-a="mpdone" data-v="'+m.id+'" data-k="'+x.id+'" title="해결">✓</button><button class="mpx" data-a="mpdel" data-v="'+m.id+'" data-k="'+x.id+'" title="지우기">×</button>')+'</div>'; });
  off.forEach(x=>{ h+='<div class="mpr done" data-id="'+x.id+'"><span class="n">–</span><span class="t">'+esc(x.t)+'</span><em>'+(x.doneAt?esc(fmtMD(x.doneAt))+' 해결':'해결')+'</em>'+

function memPrioAction(a,m,k){
  if(!m||S.ro)return;
  m.prio=Array.isArray(m.prio)?m.prio:[];
  const x=m.prio.find(p=>p.id===k);
  if(a==="mpdone"&&x){ pushUndo(x.done?"우선순위 되돌림":"우선순위 해결");

    else{ const on=m.prio.filter(p=>!p.done&&p!==x), off=m.prio.filter(p=>p.done); m.prio=on.concat([x],off); }
    logAct(x.done?"우선순위 해결":"우선순위 되돌림",m.name+" · "+x.t); }

/* 새 체험·서명·우선순위 버튼 */
const TR_ACTS=["trg","trdotdel","trdotname","sgreload","sglist","sgopen","sgclose","sgdone","sgpadclear","sgchk","mpdone","mpdel"];
function trAct(a,v,el){
  if(a==="sglist"){ S.signList=true; S.signId=null; paintSign(); return true; }
  if(a==="sgopen"){ SG.fromList=!!S.signList; sgOpen(v); return true; }
  if(a==="sgreload"){ location.reload(); return true; }
  if(a==="sgclose"){ if(S.signId){ const back=!!SG.fromList||CONSULT; sgClose(); if(back&&!S.signId){ S.signList=true; paintSign(); } } else if(!CONSULT){ S.signList=false; paintSign(); } return true; }
  if(S.ro)return false;
  if(a==="sgdone"){ sgDone(); return true; }
  if(a==="sgpadclear"){ SG.sig=[]; SG.hash=null; sgPadInit(); return true; }
  if(a==="sgchk"){ SG.chk[el.dataset.k]=!!el.checked; sgMsg(""); return true; }
  if(a==="trdotname"){ trDotEdit(el); return true; }
  if(a==="trg"||a==="trdotdel"){
    const t=trFind(el.dataset.t); if(!t||t.sign)return true;
    const b=trBody(t);
    if(a==="trg"){ if(b.g===v)return true;
      if(trIs2(b)){ bf2Remap(b,v); b.g=v; }             /* 몸 폭 비율로 옮기고, 고친 이름은 그대로 */
      else{ b.g=v; (b.dots||[]).forEach(d=>{ if(!d.e)d.r=bfRegion(v,d.v,d.x,d.y); }); (b.pins||[]).forEach(p=>{ if(!p.e)p.r=bfRegion(v,p.v,p.x,p.y); }); } }
    else b.dots.splice(+v,1);
    trBump(t,"b"); trChanged(t); return true;
  }
  if(a==="mpdone"||a==="mpdel"){ memPrioAction(a,byId(S.members,v),el.dataset.k); return true; }
  return false;
}

    const x=S.trials.find(y=>y.id===v); if(!x)return true;
    if(a==="triallink"){ const m=byId(S.members,t.dataset.k); if(!m)return true;
      pushUndo("체험 연결"); x.memberId=m.id; x.linkedAt=TODAY(); logAct("체험 연결",x.name+" → "+m.name); memPrioInit(m);
      toast(m.name+" 회원에게 연결했어요."+(trialGiveStaff(x,m)?" 책임자를 "+staffName(m)+" 샘으로 넣었어요.":"")); }
    if(a==="trialnot"){ pushUndo("체험 연결 안 함"); (x.no=x.no||[]).push(t.dataset.k); }
    if(a==="trialunlink"){ if(!confirm("이 체험 기록을 회원에게서 떼어낼까요?"))return true;
      pushUndo("체험 연결 끊기"); (x.no=x.no||[]).push(x.memberId); logAct("체험 연결 끊기",x.name); x.memberId=null; toast("떼어냈어요. 체험 탭에 미등록으로 돌아갔어요."); }
    save(); render(); return true;
  }
  return false;
}

/* ===================== 재등록 가능성 ===================== */
/* 우리 센터의 끝난 수강권들로 '비슷한 조건에서 몇 %가 재등록했나'를 세고,
   그 차이를 점수로 바꿔 더한다. 엑셀을 올릴 때마다 표가 새로 계산된다.
   - 재등록 = 그 수강권보다 뒤에 시작한 수강권이 하나라도 있으면 (누구에게, 무엇을 끊었든)
   - 끝났는데 60일이 안 지났고 아직 새 수강권이 없으면 결론이 안 난 것이라 뺀다 */
const RP_WAIT=60;
const RP_F=[
  {k:"hist",label:"재등록 이력",f:x=>x.prior>=1?"있음":"처음"},
  {k:"size",label:"수강권 크기",f:x=>!x.total?null:x.total<=21?"20회 이하":x.total<=35?"30회대":"50회 이상"},
  {k:"left",label:"끝날 때 남는 회차",f:x=>x.left==null?null:x.left<=0?"다 씀":x.left<=5?"1~5회 남김":"6회+ 남김"},
  {k:"age",label:"나이",f:x=>x.age==null?null:x.age<40?"40세 미만":x.age<60?"40~59세":"60세 이상"}
];
const RP_ORDER={hist:["있음","처음"],size:["50회 이상","30회대","20회 이하"],left:["다 씀","1~5회 남김","6회+ 남김"],age:["40~59세","60세 이상","40세 미만"]};
let RP={f:"soon",sort:"end",g:"main"};
/* 잠수 — 이만큼 넘게 안 나오고 앞으로 예약도 없으면 사실상 이탈로 보고 예측에서 뺀다 */
const DIVE_DAYS=60;
const rpBirthYear=m=>{ const y=m.birth?+String(m.birth).slice(0,4):0; return y>1900?y:null; };
const rpSorted=m=>(m.passes||[]).filter(p=>p.start).slice().sort((a,b)=>String(a.start).localeCompare(String(b.start)));
/* 과거 표본: 끝난 수강권 하나하나 */
function rpSamples(){
  return cache("rp","samples",()=>{
    const out=[], today=TODAY();
    S.members.forEach(m=>{
      const ps=rpSorted(m), by=rpBirthYear(m), lv=lastVisit(m);
      ps.forEach((p,i)=>{
        const rem=+p.remaining||0, ended=rem<=0||(p.expiry&&p.expiry<today);
        if(!ended)return;
        const renewed=ps.some((q,j)=>j>i&&String(q.start)>String(p.start));
        let end=rem<=0?(p.zeroAt||(lv?D(lv):null)||p.expiry):p.expiry;
        if(end&&p.expiry&&end>p.expiry)end=p.expiry;
        const ed=parseD(end);
        if(!renewed&&(!ed||daysBetween(new Date(),ed)<RP_WAIT))return;
        const sy=+String(p.start).slice(0,4);
        out.push({m,p,renewed,prior:i,total:+p.total||0,left:rem,age:by&&sy?sy-by:null});
      });
    });
    return out;
  });
}
/* 표 만들기 (라플라스 1 — 표본이 적은 칸이 튀지 않게) */
function rpFit(data){
  const y=data.filter(s=>s.renewed).length, n=data.length;
  const base=Math.log((y+1)/(n-y+1)), tab={}, cnt={};
  RP_F.forEach(F=>{
    const c={};
    data.forEach(s=>{ const v=F.f(s); if(v==null)return; (c[v]=c[v]||[0,0])[s.renewed?0:1]++; });
    tab[F.k]={}; cnt[F.k]=c;
    Object.keys(c).forEach(v=>{ const [a,b]=c[v]; tab[F.k][v]=Math.log((a+1)/(y+2))-Math.log((b+1)/(n-y+2)); });
  });
  return {base,tab,cnt,n,y};
}
const rpPts=z=>Math.round(z*10);
const rpProb=pts=>1/(1+Math.exp(-pts/10));
function rpScore(M,x){
  let pts=rpPts(M.base); const parts=[];
  RP_F.forEach(F=>{ const v=F.f(x); if(v==null||!(v in M.tab[F.k]))return;
    const q=rpPts(M.tab[F.k][v]); pts+=q; parts.push({k:F.k,label:F.label,v,q}); });
  return {pts,p:rpProb(pts),parts};
}
function rpModel(){ return cache("rp","model",()=>{ const d=rpSamples(); return d.length>=20?rpFit(d):null; }); }
/* 맞춰보기: 한 건씩 빼고 나머지로 만든 표로 그 건을 맞힌다 */
function rpBacktest(){
  return cache("rp","bt",()=>{
    const d=rpSamples(); if(d.length<20)return null;
    const b={hi:[0,0],mid:[0,0],lo:[0,0]};
    d.forEach((s,i)=>{ const M=rpFit(d.slice(0,i).concat(d.slice(i+1))), p=rpScore(M,s).p;
      const k=p>=.8?"hi":p>=.55?"mid":"lo"; b[k][0]+=s.renewed?1:0; b[k][1]++; });
    return b;
  });
}
/* 지금 회원: 살아 있는 수강권 기준, 끝날 때 남을 회차는 지금까지의 속도로 예상 */
function rpNow(m){
  const lp=livePasses(m); if(!lp.length)return null;
  if(lp.length>=2)return {already:true};
  const p=lp[0], ps=rpSorted(m), i=Math.max(0,ps.indexOf(p));
  const rem=+p.remaining||0, used=(+p.total||0)-rem, st=parseD(p.start), ex=parseD(p.expiry);
  let perDay=null;
  if(st){ const dd=daysBetween(new Date(),st); if(dd>=14)perDay=Math.max(0,used)/dd; }   /* 2주 넘게 한 번도 안 썼으면 속도 0 */
  if(perDay==null){ const w=usePerWeek(m); if(w>0)perDay=w/7; }
  let left=null;
  if(ex&&perDay!=null){ const toEnd=Math.max(0,daysBetween(ex,new Date())); left=Math.max(0,Math.round(rem-perDay*toEnd)); }
  else if(!ex)left=0;
  const by=rpBirthYear(m);
  return {p,x:{prior:i,total:+p.total||0,left,age:by?new Date().getFullYear()-by:null},rem,perDay};
}
function rpEndDays(m,n){
  const e=etaDays(m), ex=n&&n.p?parseD(n.p.expiry):null;
  const byExp=ex?daysBetween(ex,new Date()):null;
  const c=[e,byExp].filter(v=>v!=null); return c.length?Math.min.apply(null,c):null;
}
/* 끝나는 때 문구 — 다 쓰기 전에 기간이 먼저 끝나면 '만료'로 적는다 */
function rpEndText(m,n,end){
  if(end==null)return "끝나는 때 모름";
  const e=etaDays(m), exp=n.p&&n.p.expiry&&(e==null||daysBetween(parseD(n.p.expiry),new Date())<e);
  const d=new Date(Date.now()+end*86400000), now=new Date();
  const t=end<=0?"곧":end<=13?end+"일 뒤":end<=60?Math.round(end/7)+"주 뒤":(d.getFullYear()!==now.getFullYear()?"내년 ":"")+(d.getMonth()+1)+"월";
  return t+(exp?" 기간 만료":" 소진");
}
